name: Phase 3 repair vertical widget extraction

on:
  push:
    branches:
      - refactor/phase3-standalone-ui

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-standalone-ui

      - name: Rebuild app.py from clean main and extract VerticalWordText safely
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          clean_sha = "aeae65ad9088cfc54b438d53bef9832023723c2e"
          original = subprocess.check_output(
              ["git", "show", f"{clean_sha}:src/picture_capture/app.py"],
              text=True,
              encoding="utf-8",
          )

          start_token = "\nclass VerticalWordText(tk.Text):"
          end_token = "\ndef vertical_marker_contact_gap("
          assert original.count(start_token) == 1, "VerticalWordText class boundary changed"
          start = original.index(start_token)
          end = original.index(end_token, start)
          extracted = original[start:end]
          for contract in (
              "def _entry_index(index) -> str:",
              "def get(self, *args):",
              "def selection_range(self, start, end) -> None:",
          ):
              assert contract in extracted, f"missing VerticalWordText contract: {contract}"

          # Delete using offsets from the untouched source first.
          text = original[:start] + "\n" + original[end:]

          import_block = '''from .ui_compat import (
              AUTO_FONT_FAMILY, bind_context_menu, fit_window_to_work_area,
              normalize_content_font_setting, preferred_font_family, resolve_content_font_family,
          )
          '''
          widget_import = "from .ui.widgets.vertical_word import VerticalWordText\n"
          assert text.count(import_block) == 1, "ui_compat import block changed"
          assert widget_import not in text
          text = text.replace(import_block, import_block + widget_import, 1)

          assert "class VerticalWordText(tk.Text):" not in text
          assert text.count(widget_import) == 1
          assert 'return gray.point(lambda pixel: 255 if pixel > threshold else 0, mode="1").convert("RGB")' in text
          assert '\ndef vertical_marker_contact_gap(' in text

          app_path = Path("src/picture_capture/app.py")
          app_path.write_text(text, encoding="utf-8", newline="\n")

          normalized_size = len(app_path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n"))
          assert normalized_size < 1_080_241, normalized_size
          guard_path = Path("scripts/architecture_guard.py")
          guard = guard_path.read_text(encoding="utf-8")
          match = re.search(r'("app\.py":\s*)([0-9_]+)(,)', guard)
          assert match, "app.py architecture baseline not found"
          rendered = f"{normalized_size:_}"
          guard = guard[:match.start(2)] + rendered + guard[match.end(2):]
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"repaired app.py size: {normalized_size}")

      - name: Remove repair workflow and commit
        shell: bash
        run: |
          rm .github/workflows/phase3_repair_vertical_word_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/picture_capture/app.py scripts/architecture_guard.py .github/workflows/phase3_repair_vertical_word_once.yml
          git commit -m "fix: repair vertical widget extraction from clean main"
          git push origin HEAD:refactor/phase3-standalone-ui
