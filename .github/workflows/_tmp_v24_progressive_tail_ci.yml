name: Temporary v24 Progressive Tail Validation

on:
  push:
    branches:
      - feature/progressive-tail-retention-v24

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Focused geometry tests
        run: uv run --locked pytest -q tests/test_orthogonal_dewarp.py tests/test_preprocess_geometry.py tests/test_image_preprocessing.py
      - name: Full pytest
        run: uv run --locked pytest -q
      - name: Compile
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py
      - name: Undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py
