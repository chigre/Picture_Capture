name: Temporary preprocess navigation validation

on:
  push:
    branches:
      - fix/preprocess-navigation-during-analysis

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Focused UI regression tests
        run: uv run --locked pytest -q tests/test_core.py -k "preprocess_page_list_click or preprocess_analysis_keeps_viewer_zoom or load_page_resets_scroll_position_without_resetting_zoom"
      - name: Full pytest
        run: uv run --locked pytest -q
      - name: Compile
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py
      - name: Undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py
