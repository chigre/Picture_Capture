name: Phase 3 one-shot crop settings extraction

on:
  push:
    branches:
      - refactor/phase3-crop-settings-dialog

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-crop-settings-dialog

      - name: Extract CropSettingsDialog and crop schema from app.py
        shell: python
        run: |
          from pathlib import Path
          import py_compile
          import re

          root = Path("src/picture_capture")
          app_path = root / "app.py"
          text = app_path.read_text(encoding="utf-8")

          # Remove the local crop schema first, before changing import offsets.
          schema_start = "\nCROP_SETTINGS_VERSION = 7\n\n\ndef _normalize_crop_settings_payload("
          schema_end = "\n\nOCR_SCOPE_LABELS ="
          assert text.count(schema_start) == 1
          start = text.index(schema_start)
          end = text.index(schema_end, start)
          text = text[:start] + "\n" + text[end:]

          # Remove the standalone dialog while preserving PictureCaptureApp.
          dialog_start = "\nclass CropSettingsDialog(tk.Toplevel):"
          app_start = "\nclass PictureCaptureApp(tk.Tk):"
          assert text.count(dialog_start) == 1
          start = text.index(dialog_start)
          end = text.index(app_start, start)
          text = text[:start] + "\n" + text[end:]

          # Publish both compatibility aliases from their new owners.
          dialog_anchor = "from .ui.dialogs.ocr_conflict import OCRConflictReviewDialog\n"
          dialog_import = "from .ui.dialogs.crop_settings import CropSettingsDialog\n"
          assert text.count(dialog_anchor) == 1
          assert dialog_import not in text
          text = text.replace(dialog_anchor, dialog_anchor + dialog_import, 1)

          coordinate_anchor = "from .coordinate_space import SOURCE_COORDINATE_SPACE, coordinate_contract\n"
          schema_import = (
              "from .crop.settings import (\n"
              "    CROP_SETTINGS_VERSION,\n"
              "    normalize_crop_settings_payload as _normalize_crop_settings_payload,\n"
              ")\n"
          )
          assert text.count(coordinate_anchor) == 1
          assert schema_import not in text
          text = text.replace(coordinate_anchor, coordinate_anchor + schema_import, 1)

          assert "class CropSettingsDialog(tk.Toplevel):" not in text
          assert "def _normalize_crop_settings_payload(" not in text
          assert "CROP_SETTINGS_VERSION = 7" not in text
          assert text.count(dialog_import) == 1
          assert text.count("normalize_crop_settings_payload as _normalize_crop_settings_payload") == 1
          app_path.write_text(text, encoding="utf-8", newline="\n")
          py_compile.compile(str(app_path), doraise=True)

          # ReviewWindow is now followed directly by PictureCaptureApp in app.py.
          test_core = Path("tests/test_core.py")
          core = test_core.read_text(encoding="utf-8")
          old_review = '.index("class CropSettingsDialog",'
          core_review_count = core.count(old_review)
          assert core_review_count == 26, core_review_count
          core = core.replace(old_review, '.index("class PictureCaptureApp",')

          # Crop-dialog source-shape tests now inspect the extracted module.
          crop_read = (
              '(Path(__file__).resolve().parents[1] / "src" / "picture_capture" / '
              '"ui" / "dialogs" / "crop_settings.py").read_text(encoding="utf-8")'
          )
          double_crop = 'text.split("class CropSettingsDialog", 1)[1].split("class PictureCaptureApp", 1)[0]'
          single_crop = "text.split('class CropSettingsDialog', 1)[1].split('class PictureCaptureApp', 1)[0]"
          crop_shape_count = core.count(double_crop) + core.count(single_crop)
          assert crop_shape_count == 4, crop_shape_count
          core = core.replace(double_crop, crop_read).replace(single_crop, crop_read)

          old_settings_boundary = 'text.split("class SettingsDialog", 1)[1].split("class CropSettingsDialog", 1)[0]'
          settings_boundary_count = core.count(old_settings_boundary)
          assert settings_boundary_count == 2, settings_boundary_count
          core = core.replace(
              old_settings_boundary,
              'text.split("class SettingsDialog", 1)[1].split("class ReviewWindow", 1)[0]',
          )

          # Default normalization now belongs to the UI-free crop schema.
          old_default_assert = '    assert \'"integrate_illustrations": True\' in text\n'
          assert core.count(old_default_assert) == 1
          core = core.replace(
              old_default_assert,
              '    schema = (Path(__file__).resolve().parents[1] / "src" / "picture_capture" / "crop" / "settings.py").read_text(encoding="utf-8")\n'
              '    assert \'"integrate_illustrations": True\' in schema\n',
              1,
          )
          assert old_review not in core
          assert '.split("class CropSettingsDialog"' not in core
          assert ".split('class CropSettingsDialog'" not in core
          test_core.write_text(core, encoding="utf-8", newline="\n")
          py_compile.compile(str(test_core), doraise=True)

          next_stage_path = Path("tests/test_next_stage_regressions.py")
          next_stage = next_stage_path.read_text(encoding="utf-8")
          next_review_count = next_stage.count(old_review)
          assert next_review_count == 4, next_review_count
          next_stage = next_stage.replace(old_review, '.index("class PictureCaptureApp",')

          old_crop_block = (
              '    crop_start = source.index("class CropSettingsDialog")\n'
              '    crop_end = source.index("class PictureCaptureApp", crop_start)\n'
              '    crop = source[crop_start:crop_end]\n'
          )
          assert next_stage.count(old_crop_block) == 1
          next_stage = next_stage.replace(
              old_crop_block,
              '    crop = (\n'
              '        Path(__file__).resolve().parents[1]\n'
              '        / "src" / "picture_capture" / "ui" / "dialogs" / "crop_settings.py"\n'
              '    ).read_text(encoding="utf-8")\n',
              1,
          )
          assert old_review not in next_stage
          next_stage_path.write_text(next_stage, encoding="utf-8", newline="\n")
          py_compile.compile(str(next_stage_path), doraise=True)

          # Ratchet app.py debt to the new normalized source size.
          normalized_size = len(
              app_path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          )
          guard_path = Path("scripts/architecture_guard.py")
          guard = guard_path.read_text(encoding="utf-8")
          match = re.search(r'("app\.py":\s*)([0-9_]+)(,)', guard)
          assert match
          old_size = int(match.group(2).replace("_", ""))
          assert normalized_size < old_size, (normalized_size, old_size)
          guard = guard[:match.start(2)] + f"{normalized_size:_}" + guard[match.end(2):]
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(
              f"Review boundaries: core={core_review_count}, next={next_review_count}; "
              f"crop source slices={crop_shape_count}; app.py {old_size}->{normalized_size}"
          )

      - name: Remove one-shot workflow and commit extraction
        shell: bash
        run: |
          rm .github/workflows/phase3_extract_crop_settings_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/picture_capture/app.py scripts/architecture_guard.py tests/test_core.py tests/test_next_stage_regressions.py .github/workflows/phase3_extract_crop_settings_once.yml
          git commit -m "refactor: use extracted crop settings dialog"
          git push origin HEAD:refactor/phase3-crop-settings-dialog
