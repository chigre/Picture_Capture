name: Phase 4G one-shot DetectionController action wiring

on:
  push:
    branches:
      - refactor/phase4g-detection-controller-actions
    paths:
      - .github/workflows/phase4g_detection_controller_actions_once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase4g-detection-controller-actions

      - name: Wire OCR detection actions through DetectionController
        shell: python
        run: |
          import ast
          from pathlib import Path
          import py_compile
          import re

          app_path = Path("src/picture_capture/app.py")
          init_path = Path("src/picture_capture/ui/controllers/__init__.py")
          controller_path = Path("src/picture_capture/ui/controllers/detection.py")
          guard_path = Path("scripts/architecture_guard.py")

          app = app_path.read_text(encoding="utf-8")

          old_import = (
              "from .ui.controllers import (\n"
              "    CanvasController, PageController, ProjectController, ReviewController,\n"
              "    SESSION_STATE_FILENAME, SessionController,\n"
              ")\n"
          )
          new_import = (
              "from .ui.controllers import (\n"
              "    CanvasController, DetectionController, PageController, ProjectController,\n"
              "    ReviewController, SESSION_STATE_FILENAME, SessionController,\n"
              ")\n"
          )
          assert app.count(old_import) == 1
          app = app.replace(old_import, new_import, 1)

          init_anchor = (
              "        self.canvas_controller = CanvasController(self)\n"
              "        self.project_controller = ProjectController(self)\n"
              "        self.page_controller = PageController(self)\n"
              "        self.review_controller = ReviewController(self)\n"
              "        self._build_ui()\n"
          )
          assert app.count(init_anchor) == 1
          app = app.replace(
              init_anchor,
              "        self.canvas_controller = CanvasController(self)\n"
              "        self.detection_controller = DetectionController(self)\n"
              "        self.project_controller = ProjectController(self)\n"
              "        self.page_controller = PageController(self)\n"
              "        self.review_controller = ReviewController(self)\n"
              "        self._build_ui()\n",
              1,
          )

          tree = ast.parse(app)
          cls = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "PictureCaptureApp"
          )
          methods = {
              node.name: node
              for node in cls.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          helper_and_paddle = (
              "    def _detection_controller_for_call(self) -> DetectionController:\n"
              "        controller = self.__dict__.get(\"detection_controller\")\n"
              "        if controller is None:\n"
              "            controller = DetectionController(self)\n"
              "            self.__dict__[\"detection_controller\"] = controller\n"
              "        return controller\n\n"
              "    def paddle_detect_current(self, force_refresh: bool = False) -> None:\n"
              "        self._detection_controller_for_call().paddle_detect_current(force_refresh)\n\n"
          )
          replacements = {
              "paddle_detect_current": helper_and_paddle,
              "run_combined_draw_action": (
                  "    def run_combined_draw_action(self) -> None:\n"
                  "        self._detection_controller_for_call().run_combined_draw_action()\n\n"
              ),
              "run_ocr_draw_action": (
                  "    def run_ocr_draw_action(self) -> None:\n"
                  "        self._detection_controller_for_call().run_ocr_draw_action()\n\n"
              ),
              "run_ocr_draw": (
                  "    def run_ocr_draw(self, scope: str, force_refresh: bool) -> None:\n"
                  "        self._detection_controller_for_call().run_ocr_draw(scope, force_refresh)\n\n"
              ),
          }
          assert set(replacements).issubset(methods)

          lines = app.splitlines(keepends=True)
          spans = []
          for name, replacement in replacements.items():
              node = methods[name]
              start = min([node.lineno] + [d.lineno for d in node.decorator_list]) - 1
              end = node.end_lineno
              spans.append((start, end, replacement))
          for start, end, replacement in sorted(spans, reverse=True):
              lines[start:end] = replacement.splitlines(keepends=True)
          app = "".join(lines)
          app_path.write_text(app, encoding="utf-8", newline="\n")

          controllers_init = init_path.read_text(encoding="utf-8")
          old_init = (
              '"""Explicit controllers coordinating Picture Capture UI workflows."""\n\n'
              "from .canvas import CanvasController\n"
              "from .page import PageController\n"
              "from .project import ProjectController\n"
              "from .review import ReviewController\n"
              "from .session import SESSION_STATE_FILENAME, SessionController\n\n"
              '__all__ = [\n'
              '    "CanvasController", "PageController", "ProjectController", "ReviewController",\n'
              '    "SessionController", "SESSION_STATE_FILENAME",\n'
              ']\n'
          )
          new_init = (
              '"""Explicit controllers coordinating Picture Capture UI workflows."""\n\n'
              "from .canvas import CanvasController\n"
              "from .detection import DetectionController\n"
              "from .page import PageController\n"
              "from .project import ProjectController\n"
              "from .review import ReviewController\n"
              "from .session import SESSION_STATE_FILENAME, SessionController\n\n"
              '__all__ = [\n'
              '    "CanvasController", "DetectionController", "PageController", "ProjectController",\n'
              '    "ReviewController", "SessionController", "SESSION_STATE_FILENAME",\n'
              ']\n'
          )
          assert controllers_init == old_init
          init_path.write_text(new_init, encoding="utf-8", newline="\n")

          updated = app_path.read_text(encoding="utf-8")
          assert updated.count("self.detection_controller = DetectionController(self)") == 1
          assert updated.index("self.detection_controller = DetectionController(self)") < updated.index("self._build_ui()")
          assert 'self.__dict__.get("detection_controller")' in updated
          for method in (
              "paddle_detect_current",
              "run_combined_draw_action",
              "run_ocr_draw_action",
              "run_ocr_draw",
          ):
              assert f"self._detection_controller_for_call().{method}" in updated
          # Ordinary drawing remains intentionally outside this controller while
          # ordinary_action_runtime still replaces its app method at runtime.
          assert "def run_normal_draw_action(self) -> None:" in updated

          controller = controller_path.read_text(encoding="utf-8")
          controller_tree = ast.parse(controller)
          for node in ast.walk(controller_tree):
              if isinstance(node, ast.Import):
                  assert all(alias.name != "picture_capture.app" for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  assert node.module not in {"app", "picture_capture.app"}

          py_compile.compile(str(app_path), doraise=True)
          py_compile.compile(str(init_path), doraise=True)
          py_compile.compile(str(controller_path), doraise=True)

          final_size = len(app_path.read_bytes())
          guard = guard_path.read_text(encoding="utf-8")
          pattern = r'(    "app\.py": )\d[\d_]*(,)'
          assert len(re.findall(pattern, guard)) == 1
          rendered = f"{final_size:,}".replace(",", "_")
          guard = re.sub(pattern, rf'\g<1>{rendered}\2', guard, count=1)
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"FINAL_APP_BYTES={final_size}")

      - name: Check patch whitespace
        run: git diff --check

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove one-shot workflow and commit DetectionController wiring
        shell: bash
        run: |
          rm .github/workflows/phase4g_detection_controller_actions_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/architecture_guard.py \
            src/picture_capture/app.py \
            src/picture_capture/ui/controllers/__init__.py \
            src/picture_capture/ui/controllers/detection.py \
            tests/test_ui_detection_controller.py \
            .github/workflows/phase4g_detection_controller_actions_once.yml
          git commit -m "refactor: route OCR detection actions through DetectionController"
          git push origin HEAD:refactor/phase4g-detection-controller-actions
