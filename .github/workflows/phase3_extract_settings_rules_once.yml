name: Phase 3 one-shot Settings rules extraction

on:
  push:
    branches:
      - refactor/phase3-settings-rules-behavior

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-settings-rules-behavior

      - name: Extract Settings rules editor methods
        shell: python
        run: |
          import ast
          from pathlib import Path
          import py_compile
          import textwrap

          app_path = Path("src/picture_capture/app.py")
          guard_path = Path("scripts/architecture_guard.py")
          rules_path = Path("src/picture_capture/ui/settings/rules.py")

          text = app_path.read_text(encoding="utf-8")
          import_anchor = "from .ui.settings import profile as _settings_profile_ui\n"
          assert text.count(import_anchor) == 1
          assert "from .ui.settings import rules as _settings_rules_ui" not in text
          text = text.replace(
              import_anchor,
              import_anchor + "from .ui.settings import rules as _settings_rules_ui\n",
              1,
          )

          tree = ast.parse(text)
          cls = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "SettingsDialog"
          )
          methods = [
              node for node in cls.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          target_names = [
              "_rules_path",
              "load_rules_editor",
              "restore_default_rules",
              "import_rules",
              "export_rules",
          ]
          method_map = {node.name: node for node in methods}
          first_index = next(i for i, node in enumerate(methods) if node.name == target_names[0])
          assert [node.name for node in methods[first_index:first_index + len(target_names)]] == target_names
          assert methods[first_index + len(target_names)].name == "_schedule_autosave"

          wrapper_source = textwrap.dedent('''
          def _rules_path(self) -> Path | None:
              return _settings_rules_ui.rules_path(self)

          def load_rules_editor(self) -> None:
              _settings_rules_ui.load_rules_editor(self)

          def restore_default_rules(self) -> None:
              _settings_rules_ui.restore_default_rules(self)

          def import_rules(self) -> None:
              _settings_rules_ui.import_rules(self)

          def export_rules(self) -> None:
              _settings_rules_ui.export_rules(self)
          ''').lstrip("\n")
          wrappers = textwrap.indent(wrapper_source, "    ") + "\n"

          first = method_map[target_names[0]]
          next_method = method_map["_schedule_autosave"]
          lines = text.splitlines(keepends=True)
          text = (
              "".join(lines[: first.lineno - 1])
              + wrappers
              + "".join(lines[next_method.lineno - 1 :])
          )
          app_path.write_text(text, encoding="utf-8", newline="\n")

          py_compile.compile(str(app_path), doraise=True)
          py_compile.compile(str(rules_path), doraise=True)

          size = len(app_path.read_bytes())
          guard = guard_path.read_text(encoding="utf-8")
          old = '    "app.py": 925_454,'
          assert guard.count(old) == 1
          rendered = f"{size:,}".replace(",", "_")
          guard = guard.replace(old, f'    "app.py": {rendered},', 1)
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"APP_BYTES={size}")

      - name: Check patch whitespace
        run: git diff --check

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove one-shot workflow and commit extraction
        shell: bash
        run: |
          rm .github/workflows/phase3_extract_settings_rules_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/picture_capture/app.py scripts/architecture_guard.py .github/workflows/phase3_extract_settings_rules_once.yml
          git commit -m "refactor: route Settings rules editor through helper"
          git push origin HEAD:refactor/phase3-settings-rules-behavior
