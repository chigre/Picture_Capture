name: Phase 3 one-shot review boundary migration

on:
  push:
    branches:
      - refactor/phase3-ocr-conflict-dialog

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-ocr-conflict-dialog

      - name: Migrate ReviewWindow source boundaries
        shell: python
        run: |
          from pathlib import Path

          old = '"class OCRConflictReviewDialog"'
          new = '"class CropSettingsDialog"'
          paths = [
              Path("tests/test_core.py"),
              Path("tests/test_next_stage_regressions.py"),
          ]
          changed = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              print(f"{path}: {count} old ReviewWindow boundary markers")
              if count:
                  text = text.replace(old, new)
                  path.write_text(text, encoding="utf-8", newline="\n")
                  changed += count
              assert old not in path.read_text(encoding="utf-8")
          assert changed == 30, f"expected 30 migrated boundaries, got {changed}"

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/phase3_fix_review_boundary_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_core.py tests/test_next_stage_regressions.py .github/workflows/phase3_fix_review_boundary_once.yml
          git commit -m "test: follow ReviewWindow boundary after OCR dialog extraction"
          git push origin HEAD:refactor/phase3-ocr-conflict-dialog
