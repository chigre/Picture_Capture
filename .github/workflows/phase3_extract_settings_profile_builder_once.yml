name: Phase 3 one-shot Settings profile builder extraction

on:
  push:
    branches:
      - refactor/phase3-settings-profile-builder
    paths:
      - .github/workflows/phase3_extract_settings_profile_builder_once.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-settings-profile-builder

      - name: Extract Settings Profile tab builder
        shell: python
        run: |
          import ast
          from pathlib import Path
          import py_compile
          import re
          import textwrap

          app_path = Path("src/picture_capture/app.py")
          profile_path = Path("src/picture_capture/ui/settings/profile.py")
          guard_path = Path("scripts/architecture_guard.py")
          profile_test_path = Path("tests/test_ui_settings_profile.py")
          regression_path = Path("tests/test_next_stage_regressions.py")

          app = app_path.read_text(encoding="utf-8")
          tree = ast.parse(app)
          cls = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "SettingsDialog"
          )
          methods = [
              node for node in cls.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          method_map = {node.name: node for node in methods}
          target = method_map["_build_profile_tab"]
          target_index = next(i for i, node in enumerate(methods) if node.name == target.name)
          assert methods[target_index + 1].name == "_build_profile_choice_labels"
          next_method = methods[target_index + 1]

          lines = app.splitlines(keepends=True)
          original_method = "".join(lines[target.lineno - 1 : next_method.lineno - 1])
          dedented = textwrap.dedent(original_method)
          assert dedented.startswith("def _build_profile_tab(self, tab: ttk.Frame) -> None:\n")
          body = dedented.split("\n", 1)[1]
          body = re.sub(r"\bself\b", "dialog", body)
          helper_method = (
              "def build_profile_tab(dialog: Any, tab: ttk.Frame) -> None:\n"
              + body.rstrip()
              + "\n\n\n"
          )
          assert "self." not in helper_method

          profile = profile_path.read_text(encoding="utf-8")
          assert "def build_profile_tab(" not in profile
          assert profile.count("import tkinter as tk\n") == 1
          profile = profile.replace(
              "import tkinter as tk\n",
              "import tkinter as tk\nfrom tkinter import ttk\n",
              1,
          )
          assert profile.count("    dictionary_profile_preset,\n") == 1
          profile = profile.replace(
              "    dictionary_profile_preset,\n",
              "    dictionary_profile_preset,\n    effective_project_profile_id,\n",
              1,
          )
          import_anchor = "    profile_layout_summary,\n)\n\n\n"
          assert profile.count(import_anchor) == 1
          profile = profile.replace(
              import_anchor,
              "    profile_layout_summary,\n)\n"
              "from ...project_storage import profile_path as project_profile_path\n\n\n"
              + helper_method,
              1,
          )
          profile_path.write_text(profile, encoding="utf-8", newline="\n")

          wrapper = (
              "    def _build_profile_tab(self, tab: ttk.Frame) -> None:\n"
              "        _settings_profile_ui.build_profile_tab(self, tab)\n\n"
          )
          app = (
              "".join(lines[: target.lineno - 1])
              + wrapper
              + "".join(lines[next_method.lineno - 1 :])
          )
          app_path.write_text(app, encoding="utf-8", newline="\n")

          profile_test = profile_test_path.read_text(encoding="utf-8")
          loop_anchor = (
              "    for method, helper_name in (\n"
              "        (\"_build_profile_choice_labels\", \"build_profile_choice_labels\"),\n"
          )
          assert profile_test.count(loop_anchor) == 1
          profile_test = profile_test.replace(
              loop_anchor,
              "    for method, helper_name in (\n"
              "        (\"_build_profile_tab\", \"build_profile_tab\"),\n"
              "        (\"_build_profile_choice_labels\", \"build_profile_choice_labels\"),\n",
              1,
          )
          assertion_anchor = (
              "    assert \"profiles = list(available_dictionary_profiles())\" not in settings\n"
          )
          assert profile_test.count(assertion_anchor) == 1
          profile_test = profile_test.replace(
              assertion_anchor,
              "    assert \"self.profile_canvas = profile_canvas\" not in settings\n"
              "    assert \"dialog.profile_canvas = profile_canvas\" in helper\n"
              "    assert \"profile_scrollbar\" in helper\n"
              "    assert 'text=\"自定义结构名称：\"' in helper\n\n"
              + assertion_anchor,
              1,
          )
          profile_test_path.write_text(profile_test, encoding="utf-8", newline="\n")

          regression = regression_path.read_text(encoding="utf-8")
          old_block = (
              "    profile_start = text.index(\"    def _build_profile_tab(\")\n"
              "    profile_end = text.index(\"    def _build_profile_choice_labels(\", profile_start)\n"
              "    profile = text[profile_start:profile_end]\n"
              "    assert \"self.profile_canvas = profile_canvas\" in profile\n"
              "    assert \"profile_scrollbar\" in profile\n"
              "    assert 'text=\"自定义结构名称：\"' in profile\n"
          )
          assert regression.count(old_block) == 1
          new_block = (
              "    profile_source = (\n"
              "        Path(__file__).resolve().parents[1]\n"
              "        / \"src\" / \"picture_capture\" / \"ui\" / \"settings\" / \"profile.py\"\n"
              "    ).read_text(encoding=\"utf-8\")\n"
              "    assert \"dialog.profile_canvas = profile_canvas\" in profile_source\n"
              "    assert \"profile_scrollbar\" in profile_source\n"
              "    assert 'text=\"自定义结构名称：\"' in profile_source\n"
          )
          regression = regression.replace(old_block, new_block, 1)
          regression_path.write_text(regression, encoding="utf-8", newline="\n")

          py_compile.compile(str(app_path), doraise=True)
          py_compile.compile(str(profile_path), doraise=True)

          size = len(app_path.read_bytes())
          guard = guard_path.read_text(encoding="utf-8")
          old_guard = '    "app.py": 907_987,'
          assert guard.count(old_guard) == 1
          rendered = f"{size:,}".replace(",", "_")
          guard = guard.replace(old_guard, f'    "app.py": {rendered},', 1)
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"APP_BYTES={size}")

      - name: Check patch whitespace
        run: git diff --check

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove one-shot workflow and commit extraction
        shell: bash
        run: |
          rm .github/workflows/phase3_extract_settings_profile_builder_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/picture_capture/app.py \
            src/picture_capture/ui/settings/profile.py \
            scripts/architecture_guard.py \
            tests/test_ui_settings_profile.py \
            tests/test_next_stage_regressions.py \
            .github/workflows/phase3_extract_settings_profile_builder_once.yml
          git commit -m "refactor: move Settings Profile tab builder into feature module"
          git push origin HEAD:refactor/phase3-settings-profile-builder
