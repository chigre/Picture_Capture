name: Phase 5N validation

on:
  push:
    branches:
      - refactor/phase-5n-static-line-anchor

concurrency:
  group: phase5n-static-line-anchor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase-5n-static-line-anchor
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Apply Phase 5N migration
        run: uv run --locked python tools/phase5n_apply.py

      - name: Check diff shape
        shell: bash
        run: |
          set -euo pipefail
          git add -N src/picture_capture/overlay_line_anchor.py
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'scripts/architecture_guard.py',
              'src/picture_capture/bootstrap/gui.py',
              'src/picture_capture/overlay_line_anchor.py',
              'src/picture_capture/overlay_line_anchor_runtime.py',
              'src/picture_capture/overlay_opacity_runtime.py',
              'tests/test_overlay_line_anchor_direction.py',
              'tests/test_overlay_opacity_runtime.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--no-renames', '--name-only'], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected Phase 5N diff: {sorted(changed)}')
          PY

      - name: Architecture guard
        run: uv run --locked python scripts/architecture_guard.py

      - name: Focused regressions
        run: >-
          uv run --locked pytest -q
          tests/test_overlay_opacity_runtime.py
          tests/test_overlay_line_anchor_direction.py

      - name: Full suite
        run: uv run --locked pytest -q

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Remove temporary migration assets
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/phase5n_apply.py .github/workflows/phase5n-validate.yml
          git diff --check

      - name: Publish validated production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chigre3"
          git config user.email "guangdong.hu@gmail.com"
          git add scripts src tests
          git commit -m "Phase 5N: make overlay line anchoring explicit"
          git push origin HEAD:refactor/phase-5n-static-line-anchor
