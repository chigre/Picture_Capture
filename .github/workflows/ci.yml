name: CI

on:
  push:
    branches: [main, audit/settings-contract-thresholds-help-scroll-20261015]
    tags: ["v*"]
  pull_request:
    branches: [main, feat/integrated-ocr-runtime-monitor-20261014]
  schedule:
    - cron: "19 4 * * *"  # daily full test; 12:19 Asia/Singapore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    name: Risk tier
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      os313: ${{ steps.tier.outputs.os313 }}
      os310: ${{ steps.tier.outputs.os310 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify Git diff
        id: tier
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            python scripts/ci_risk_tier.py --base "$BASE_SHA" --github-output "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "branch" ]]; then
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              python scripts/ci_risk_tier.py --base HEAD^ --github-output "$GITHUB_OUTPUT"
            else
              python scripts/ci_risk_tier.py --full --github-output "$GITHUB_OUTPUT"
            fi
          else
            python scripts/ci_risk_tier.py --full --github-output "$GITHUB_OUTPUT"
          fi

  docs:
    name: Documentation architecture check
    needs: classify
    if: needs.classify.outputs.tier == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/architecture_guard.py

  test:
    needs: classify
    if: needs.classify.outputs.tier != 'docs'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.os313) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Check platform and OCR profile resolution
        run: uv run --locked python scripts/ci_platform_check.py

      - name: Enforce architecture change policy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv run --locked python scripts/architecture_guard.py
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            uv run --locked python scripts/change_architecture_guard.py --base "origin/${{ github.base_ref }}"
          else
            uv run --locked python scripts/change_architecture_guard.py
          fi

      - name: Quality golden fixtures and benchmark provenance (no scan pixels)
        run: >-
          uv run --locked pytest -q
          tests/test_headword_quality_golden_20261014.py
          tests/test_b1_benchmark_provenance_20261014.py
          tests/test_b1_merged_ocr_safety_20261014.py

      - name: Run pytest
        run: uv run --locked pytest

      - name: GUI construction smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --locked python scripts/gui_smoke.py

      - name: GUI construction smoke (Windows/macOS)
        if: runner.os != 'Linux'
        run: uv run --locked python scripts/gui_smoke.py

      - name: B2 proofreading evidence Tk integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --locked python scripts/gui_proofreading_evidence_smoke.py

      - name: B2 proofreading evidence Tk integration (Windows/macOS)
        if: runner.os != 'Linux'
        run: uv run --locked python scripts/gui_proofreading_evidence_smoke.py

      - name: R3 candidate deletion Tk transaction (Linux synthetic)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --locked python scripts/gui_r3_candidate_delete_smoke.py

      - name: R3 candidate deletion Tk transaction (Windows/macOS synthetic)
        if: runner.os != 'Linux'
        run: uv run --locked python scripts/gui_r3_candidate_delete_smoke.py

      - name: Run compatibility test runner
        run: uv run --locked python run_tests.py

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Build wheel
        run: uv build --wheel


  python310-compat:
    name: "Python 3.10 / ${{ matrix.os }}"
    needs: classify
    if: needs.classify.outputs.tier != 'docs'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.os310) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv and Python 3.10
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Install locked dependencies using Python 3.10
        run: uv sync --locked --python 3.10 --group dev
      - name: Verify actual test interpreter is Python 3.10
        run: uv run --locked --python 3.10 python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 10)"
      - name: Check platform and OCR profile resolution
        run: uv run --locked --python 3.10 python scripts/ci_platform_check.py
      - name: Enforce architecture guard
        run: uv run --locked --python 3.10 python scripts/architecture_guard.py
      - name: Run Python 3.10 regression suite
        run: uv run --locked --python 3.10 pytest
      - name: GUI construction smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --locked --python 3.10 python scripts/gui_smoke.py
      - name: GUI construction smoke (Windows/macOS)
        if: runner.os != 'Linux'
        run: uv run --locked --python 3.10 python scripts/gui_smoke.py
      - name: Run compatibility test runner
        run: uv run --locked --python 3.10 python run_tests.py
      - name: Compile Python sources on 3.10
        run: uv run --locked --python 3.10 python -m compileall -q src scripts run.py run_tests.py
      - name: Check undefined names
        run: uv run --locked --python 3.10 ruff check --select F821 src tests scripts run.py run_tests.py
      - name: Build wheel
        run: uv build --wheel


  required:
    name: Risk-tier CI gate
    needs: [classify, docs, test, python310-compat]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required tier results
        shell: bash
        env:
          CLASSIFY: ${{ needs.classify.result }}
          TIER: ${{ needs.classify.outputs.tier }}
          DOCS: ${{ needs.docs.result }}
          PY313: ${{ needs.test.result }}
          PY310: ${{ needs.python310-compat.result }}
        run: |
          python - <<'PY'
          import os
          c, t, d, p13, p10 = (os.getenv(k) for k in ("CLASSIFY", "TIER", "DOCS", "PY313", "PY310"))
          print(f"classify={c} tier={t} docs={d} py313={p13} py310={p10}")
          if c != "success":
              raise SystemExit("risk classification failed")
          if t == "docs":
              if (d, p13, p10) != ("success", "skipped", "skipped"):
                  raise SystemExit("docs tier checks failed")
          elif t in ("fast", "full"):
              if p13 != "success" or p10 != "success":
                  raise SystemExit("platform checks failed")
          else:
              raise SystemExit(f"unknown risk tier {t!r}")
          PY
