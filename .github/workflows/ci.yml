name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Check platform and OCR profile resolution
        run: uv run --locked python scripts/ci_platform_check.py

      - name: Run pytest
        run: uv run --locked pytest

      - name: GUI construction smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --locked python scripts/gui_smoke.py

      - name: GUI construction smoke (Windows/macOS)
        if: runner.os != 'Linux'
        run: uv run --locked python scripts/gui_smoke.py

      - name: Run compatibility test runner
        run: uv run --locked python run_tests.py

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Build wheel
        run: uv build --wheel

      - name: Prepare Phase 8D OCR runtime artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv sync --locked --no-dev --extra ocr-cpu
          .venv/bin/python - <<'PY'
          from picture_capture.models import AppSettings
          from picture_capture.ocr_channel import _create_paddle_engine
          settings = AppSettings(
              ocr_language="eng",
              paddle_language="en",
              paddle_ocr_version="PP-OCRv6",
              paddle_use_textline_orientation=False,
          )
          engine = _create_paddle_engine(settings)
          print(type(engine).__name__)
          PY
          mkdir -p phase8d_ocr_runtime
          cp -a .venv/lib/python3.13/site-packages phase8d_ocr_runtime/
          for cache in "$HOME/.paddlex" "$HOME/.paddleocr"; do
            if [ -d "$cache" ]; then
              cp -a "$cache" "phase8d_ocr_runtime/$(basename "$cache")"
            fi
          done
          du -sh phase8d_ocr_runtime
          tar -cf - phase8d_ocr_runtime | gzip -1 | split -b 75m - phase8d-ocr-runtime.tar.gz.part-
          ls -lh phase8d-ocr-runtime.tar.gz.part-*

      - name: Upload Phase 8D OCR runtime part aa
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: phase8d-ocr-runtime-aa
          path: phase8d-ocr-runtime.tar.gz.part-aa
          if-no-files-found: error
          compression-level: 0

      - name: Upload Phase 8D OCR runtime part ab
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: phase8d-ocr-runtime-ab
          path: phase8d-ocr-runtime.tar.gz.part-ab
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload Phase 8D OCR runtime part ac
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: phase8d-ocr-runtime-ac
          path: phase8d-ocr-runtime.tar.gz.part-ac
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload Phase 8D OCR runtime part ad
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: phase8d-ocr-runtime-ad
          path: phase8d-ocr-runtime.tar.gz.part-ad
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload Phase 8D OCR runtime part ae
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: phase8d-ocr-runtime-ae
          path: phase8d-ocr-runtime.tar.gz.part-ae
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload Phase 8D OCR runtime part af
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: phase8d-ocr-runtime-af
          path: phase8d-ocr-runtime.tar.gz.part-af
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload Phase 8D OCR runtime part ag
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: phase8d-ocr-runtime-ag
          path: phase8d-ocr-runtime.tar.gz.part-ag
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload Phase 8D OCR runtime part ah
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: phase8d-ocr-runtime-ah
          path: phase8d-ocr-runtime.tar.gz.part-ah
          if-no-files-found: ignore
          compression-level: 0
