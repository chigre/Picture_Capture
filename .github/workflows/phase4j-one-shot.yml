name: Phase 4J one-shot migration

on:
  push:
    branches: [refactor/phase4j-crop-controller-whole-entry]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase4j-crop-controller-whole-entry

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Complete Phase 4J app wiring and source-boundary update
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          root = Path.cwd()
          app_path = root / "src/picture_capture/app.py"
          guard_path = root / "scripts/architecture_guard.py"
          legacy_test_path = root / "tests/test_next_stage_regressions.py"

          text = app_path.read_text(encoding="utf-8")
          tree = ast.parse(text)
          app_class = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "PictureCaptureApp"
          )
          method = next(
              node for node in app_class.body
              if isinstance(node, ast.FunctionDef) and node.name == "split_whole_current"
          )
          assert method.end_lineno is not None
          original = "".join(text.splitlines(keepends=True)[method.lineno - 1:method.end_lineno])
          assert 'self._start_batch_task(' in original
          assert 'split_whole_entries(' in original
          assert '"当前页整体切图"' in original

          lines = text.splitlines(keepends=True)
          wrapper = '''    def split_whole_current(self) -> None:\n        self._crop_controller_for_call().split_whole_current()\n'''
          lines[method.lineno - 1:method.end_lineno] = wrapper.splitlines(keepends=True)
          text = "".join(lines)
          ast.parse(text)
          assert "def batch_split_whole(self)" in text
          assert "def _crop_settings_defaults(self)" in text
          app_path.write_text(text, encoding="utf-8")

          new_size = len(app_path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n"))
          assert new_size < 875_916, f"app.py did not shrink: {new_size}"
          guard = guard_path.read_text(encoding="utf-8")
          assert '"app.py": 875_916,' in guard
          guard = guard.replace('"app.py": 875_916,', f'"app.py": {new_size:_},', 1)
          guard_path.write_text(guard, encoding="utf-8")

          legacy = legacy_test_path.read_text(encoding="utf-8")
          old_case = '        ("split_whole_current", "_crop_settings_defaults"),\n'
          assert legacy.count(old_case) == 1, "legacy whole-entry source-shape case drifted"
          legacy = legacy.replace(old_case, "", 1)
          legacy_test_path.write_text(legacy, encoding="utf-8")

          print(f"Phase 4J app.py baseline: 875916 -> {new_size} bytes")
          PY

      - name: Run targeted Phase 4J tests
        run: uv run --locked pytest -q tests/test_ui_crop_controller.py tests/test_architecture_baseline.py tests/test_next_stage_regressions.py tests/test_postproduction_single_line_runtime.py tests/test_ui_crop_settings_dialog.py tests/test_ui_settings_crop.py

      - name: Compile touched Python
        run: uv run --locked python -m py_compile src/picture_capture/app.py src/picture_capture/ui/controllers/crop.py tests/test_ui_crop_controller.py tests/test_next_stage_regressions.py

      - name: Check diff whitespace
        run: git diff --check

      - name: Run complete pytest suite
        run: uv run --locked pytest

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Commit validated migration and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/phase4j-one-shot.yml
          git config user.name "Picture Capture Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route current-page whole-entry crop through CropController"
          git push origin HEAD:refactor/phase4j-crop-controller-whole-entry
