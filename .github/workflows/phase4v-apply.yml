name: Phase 4V isolated migration

on:
  push:
    branches: [refactor/phase-4v-review-order-report]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase-4v-review-order-report
          fetch-depth: 0

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Apply narrow Phase 4V migration
        run: |
          uv run --locked python tools/phase4v_apply.py
          uv run --locked python - <<'PY'
          from pathlib import Path
          path = Path('src/picture_capture/ui/controllers/review.py')
          text = path.read_text(encoding='utf-8')
          old = '''    Durable candidate edits, PDIC/manual-override writes, and the detailed
              translucent proofreading highlight renderer remain owned by
              ``PictureCaptureApp``.  This controller only owns candidate lookup/matching
              plus lightweight highlight/navigation state.
          '''
          new = '''    Durable candidate edits, PDIC/manual-override writes, and the detailed
              translucent proofreading highlight renderer remain owned by
              ``PictureCaptureApp``.  This controller owns candidate lookup/matching,
              lightweight highlight/navigation state, and headword-order report orchestration.
          '''
          if text.count(old) != 1:
              raise RuntimeError('review controller docstring shape changed')
          text = text.replace(old, new, 1).rstrip() + '\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate diff shape
        run: |
          git diff --check
          git status --short
          git diff -- src/picture_capture/app.py src/picture_capture/ui/controllers/review.py tests/test_ui_review_controller.py tests/test_next_stage_regressions.py

      - name: Run focused review and regression tests
        run: uv run --locked pytest -q tests/test_ui_review_controller.py tests/test_next_stage_regressions.py

      - name: Run full test suite
        run: uv run --locked pytest -q

      - name: Compile and check undefined names
        run: |
          uv run --locked python -m compileall -q src scripts run.py run_tests.py
          uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Remove temporary migration assets
        run: rm -f tools/phase4v_apply.py .github/workflows/phase4v-apply.yml

      - name: Commit validated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "refactor: route headword order review through ReviewController"
          git push origin HEAD:refactor/phase-4v-review-order-report
