name: Phase 3 one-shot Settings help extraction v2

on:
  push:
    branches:
      - refactor/phase3-settings-dialog-behavior

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-settings-dialog-behavior

      - name: Extract Settings help presentation methods
        shell: python
        run: |
          import ast
          from pathlib import Path
          import py_compile
          import textwrap

          app_path = Path("src/picture_capture/app.py")
          guard_path = Path("scripts/architecture_guard.py")
          tests_path = Path("tests/test_next_stage_regressions.py")
          text = app_path.read_text(encoding="utf-8")

          import_anchor = "from .ui.settings import schema as _settings_schema\n"
          assert text.count(import_anchor) == 1
          assert "from .ui.settings import help as _settings_help_ui" not in text
          text = text.replace(
              import_anchor,
              import_anchor + "from .ui.settings import help as _settings_help_ui\n",
              1,
          )

          tree = ast.parse(text)
          cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == "SettingsDialog")
          methods = [n for n in cls.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))]
          target_names = [
              "_show_settings_help",
              "_settings_help_image_path",
              "_load_settings_help_image",
              "_schedule_settings_help_image_render",
              "_render_settings_help_images",
              "_show_setting_help",
              "_show_check_help",
              "_bind_help_widget",
              "_bind_responsive_labels",
          ]
          assert [n.name for n in methods[:9]] == target_names
          method_map = {n.name: n for n in methods}
          first = method_map[target_names[0]]
          next_method = method_map["_setting_var"]
          lines = text.splitlines(keepends=True)

          wrapper_source = textwrap.dedent('''
          def _show_settings_help(
              self,
              title: str,
              body: str,
              image_name: str | None = None,
          ) -> None:
              _settings_help_ui.show_settings_help(self, title, body, image_name)

          def _settings_help_image_path(self, image_name: str) -> Path:
              return _settings_help_ui.settings_help_image_path(image_name)

          def _load_settings_help_image(self, image_name: str) -> Image.Image | None:
              return _settings_help_ui.load_settings_help_image(self, image_name)

          def _schedule_settings_help_image_render(self) -> None:
              _settings_help_ui.schedule_settings_help_image_render(self)

          def _render_settings_help_images(self) -> None:
              _settings_help_ui.render_settings_help_images(self)

          def _show_setting_help(self, name: str, *, show_layout_image: bool = False) -> None:
              _settings_help_ui.show_setting_help(
                  self, name, show_layout_image=show_layout_image
              )

          def _show_check_help(self, label: str, name: str) -> None:
              _settings_help_ui.show_check_help(self, label, name)

          def _bind_help_widget(self, widget: tk.Misc, callback) -> None:
              _settings_help_ui.bind_help_widget(self, widget, callback)

          def _bind_responsive_labels(
              self,
              container: tk.Misc,
              *labels: ttk.Label,
              horizontal_padding: int = 12,
              min_wrap: int = 120,
          ) -> None:
              _settings_help_ui.bind_responsive_labels(
                  self,
                  container,
                  *labels,
                  horizontal_padding=horizontal_padding,
                  min_wrap=min_wrap,
              )
          ''').lstrip("\n")
          wrappers = textwrap.indent(wrapper_source, "    ") + "\n"

          start = first.lineno - 1
          end = next_method.lineno - 1
          text = "".join(lines[:start]) + wrappers + "".join(lines[end:])
          app_path.write_text(text, encoding="utf-8", newline="\n")
          py_compile.compile(str(app_path), doraise=True)
          py_compile.compile("src/picture_capture/ui/settings/help.py", doraise=True)

          size = len(app_path.read_bytes())
          guard = guard_path.read_text(encoding="utf-8")
          old = '    "app.py": 940_260,'
          assert guard.count(old) == 1
          rendered = f"{size:,}".replace(",", "_")
          guard = guard.replace(old, f'    "app.py": {rendered},', 1)
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"APP_BYTES={size}")

          tests = tests_path.read_text(encoding="utf-8")

          def get_block(source: str, name: str):
              s = source.index(f"def {name}(")
              e = source.find("\ndef ", s + 10)
              if e < 0:
                  e = len(source)
              return s, e, source[s:e]

          def replace_once(source: str, old: str, new: str) -> str:
              count = source.count(old)
              assert count == 1, (old, count)
              return source.replace(old, new, 1)

          s, e, block = get_block(tests, "test_settings_center_uses_context_help_units_and_user_facing_modes")
          schema_tail = '    ).read_text(encoding="utf-8")\n\n'
          assert block.count(schema_tail) == 1
          block = block.replace(
              schema_tail,
              '    ).read_text(encoding="utf-8")\n'
              '    help_source = (\n'
              '        Path(__file__).resolve().parents[1]\n'
              '        / "src" / "picture_capture" / "ui" / "settings" / "help.py"\n'
              '    ).read_text(encoding="utf-8")\n\n',
              1,
          )
          for token in (
              'label_width = int(label.winfo_width())',
              'available = max(48, label_width - 12)',
              '_wrap_mixed_ui_text(',
              'label.configure(text=rendered, wraplength=0)',
              'label._pc_dynamic_textvariable = bool(textvariable)',
          ):
              block = replace_once(
                  block,
                  f'assert "{token}" in settings',
                  f'assert "{token}" in help_source',
              )
          tests = tests[:s] + block + tests[e:]

          s, e, block = get_block(tests, "test_common_layout_settings_show_packaged_context_diagrams")
          schema_line = '    schema = (root / "src" / "picture_capture" / "ui" / "settings" / "schema.py").read_text(encoding="utf-8")\n'
          assert block.count(schema_line) == 1
          block = block.replace(
              schema_line,
              schema_line
              + '    help_source = (root / "src" / "picture_capture" / "ui" / "settings" / "help.py").read_text(encoding="utf-8")\n',
              1,
          )
          block = replace_once(block, 'assert \'/ "data"\' in settings', 'assert \'/ "data"\' in help_source')
          block = replace_once(block, 'assert \'/ "layout_example"\' in settings', 'assert \'/ "layout_example"\' in help_source')
          block = replace_once(block, 'assert "Image.Resampling.LANCZOS" in settings', 'assert "Image.Resampling.LANCZOS" in help_source')
          block = replace_once(
              block,
              'assert "ImageTk.PhotoImage(themed_display_image(rendered, self.parent.appearance_mode))" in settings',
              'assert "ImageTk.PhotoImage(" in help_source\n    assert "themed_display_image(rendered, dialog.parent.appearance_mode)" in help_source',
          )
          tests = tests[:s] + block + tests[e:]
          tests_path.write_text(tests, encoding="utf-8", newline="\n")
          py_compile.compile(str(tests_path), doraise=True)

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove temporary workflows and commit extraction
        shell: bash
        run: |
          rm .github/workflows/phase3_extract_settings_help_once.yml
          rm .github/workflows/phase3_extract_settings_help_once_v2.yml
          rm .github/workflows/phase3_settings_dialog_audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/picture_capture/app.py src/picture_capture/ui/settings/help.py scripts/architecture_guard.py tests/test_next_stage_regressions.py tests/test_ui_settings_help.py .github/workflows/phase3_extract_settings_help_once.yml .github/workflows/phase3_extract_settings_help_once_v2.yml .github/workflows/phase3_settings_dialog_audit.yml
          git commit -m "refactor: extract Settings help presentation behavior"
          git push origin HEAD:refactor/phase3-settings-dialog-behavior
