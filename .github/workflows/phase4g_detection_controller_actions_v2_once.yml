name: Phase 4G one-shot DetectionController action wiring v2

on:
  push:
    branches:
      - refactor/phase4g-detection-controller-actions
    paths:
      - .github/workflows/phase4g_detection_controller_actions_v2_once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase4g-detection-controller-actions

      - name: Apply original wiring and correct boundary assertion
        shell: python
        run: |
          from pathlib import Path
          import py_compile
          import textwrap

          workflow_path = Path(".github/workflows/phase4g_detection_controller_actions_once.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          marker = (
              "      - name: Wire OCR detection actions through DetectionController\n"
              "        shell: python\n"
              "        run: |\n"
          )
          assert workflow.count(marker) == 1
          source = workflow.split(marker, 1)[1].split(
              "\n      - name: Check patch whitespace", 1
          )[0]
          exec(compile(textwrap.dedent(source), str(workflow_path) + ":wiring", "exec"), {})

          test_path = Path("tests/test_ui_detection_controller.py")
          text = test_path.read_text(encoding="utf-8")
          old = '    assert "run_normal_draw_action" not in controller\n'
          new = (
              '    controller_tree = ast.parse(controller)\n'
              '    assert not any(\n'
              '        isinstance(node, ast.FunctionDef) and node.name == "run_normal_draw_action"\n'
              '        for node in ast.walk(controller_tree)\n'
              '    )\n'
          )
          assert text.count(old) == 1
          test_path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          py_compile.compile(str(test_path), doraise=True)

      - name: Check patch whitespace
        run: git diff --check

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove one-shot workflows and commit DetectionController wiring
        shell: bash
        run: |
          rm .github/workflows/phase4g_detection_controller_actions_once.yml
          rm .github/workflows/phase4g_detection_controller_actions_v2_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/architecture_guard.py \
            src/picture_capture/app.py \
            src/picture_capture/ui/controllers/__init__.py \
            src/picture_capture/ui/controllers/detection.py \
            tests/test_ui_detection_controller.py \
            .github/workflows/phase4g_detection_controller_actions_once.yml \
            .github/workflows/phase4g_detection_controller_actions_v2_once.yml
          git commit -m "refactor: route OCR detection actions through DetectionController"
          git push origin HEAD:refactor/phase4g-detection-controller-actions
