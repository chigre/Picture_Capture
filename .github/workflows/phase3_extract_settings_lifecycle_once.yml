name: Phase 3 one-shot Settings lifecycle extraction

on:
  push:
    branches:
      - refactor/phase3-settings-lifecycle-behavior

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-settings-lifecycle-behavior

      - name: Extract Settings lifecycle methods
        shell: python
        run: |
          import ast
          from pathlib import Path
          import py_compile
          import textwrap

          app_path = Path("src/picture_capture/app.py")
          guard_path = Path("scripts/architecture_guard.py")
          lifecycle_path = Path("src/picture_capture/ui/settings/lifecycle.py")
          tests_path = Path("tests/test_next_stage_regressions.py")

          text = app_path.read_text(encoding="utf-8")
          import_anchor = "from .ui.settings import rules as _settings_rules_ui\n"
          assert text.count(import_anchor) == 1
          assert "from .ui.settings import lifecycle as _settings_lifecycle_ui" not in text
          text = text.replace(
              import_anchor,
              import_anchor + "from .ui.settings import lifecycle as _settings_lifecycle_ui\n",
              1,
          )

          tree = ast.parse(text)
          cls = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "SettingsDialog"
          )
          methods = [
              node for node in cls.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          target_names = [
              "_schedule_autosave",
              "_run_autosave",
              "_validate_settings_now",
              "_close_validated",
          ]
          method_map = {node.name: node for node in methods}
          first_index = next(i for i, node in enumerate(methods) if node.name == target_names[0])
          assert [node.name for node in methods[first_index:first_index + len(target_names)]] == target_names
          assert methods[first_index + len(target_names)].name == "save"

          wrapper_source = textwrap.dedent('''
          def _schedule_autosave(self) -> None:
              _settings_lifecycle_ui.schedule_autosave(self)

          def _run_autosave(self) -> None:
              _settings_lifecycle_ui.run_autosave(self)

          def _validate_settings_now(self) -> bool:
              return _settings_lifecycle_ui.validate_settings_now(self)

          def _close_validated(self) -> None:
              _settings_lifecycle_ui.close_validated(self)
          ''').lstrip("\n")
          wrappers = textwrap.indent(wrapper_source, "    ") + "\n"

          first = method_map[target_names[0]]
          next_method = method_map["save"]
          lines = text.splitlines(keepends=True)
          text = (
              "".join(lines[: first.lineno - 1])
              + wrappers
              + "".join(lines[next_method.lineno - 1 :])
          )
          app_path.write_text(text, encoding="utf-8", newline="\n")

          py_compile.compile(str(app_path), doraise=True)
          py_compile.compile(str(lifecycle_path), doraise=True)

          size = len(app_path.read_bytes())
          guard = guard_path.read_text(encoding="utf-8")
          old = '    "app.py": 923_609,'
          assert guard.count(old) == 1
          rendered = f"{size:,}".replace(",", "_")
          guard = guard.replace(old, f'    "app.py": {rendered},', 1)
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"APP_BYTES={size}")

          # Migrate only the two source-location assertions whose implementation
          # moved into the lifecycle helper. UI wiring remains anchored to app.py.
          tests = tests_path.read_text(encoding="utf-8")
          fn_start = tests.index(
              "def test_settings_center_uses_context_help_units_and_user_facing_modes():"
          )
          fn_end = tests.index(
              "\ndef test_settings_center_restores_inline_detailed_parameter_help():",
              fn_start,
          )
          block = tests[fn_start:fn_end]
          help_tail = (
              '    help_source = (\n'
              '        Path(__file__).resolve().parents[1]\n'
              '        / "src" / "picture_capture" / "ui" / "settings" / "help.py"\n'
              '    ).read_text(encoding="utf-8")\n'
          )
          assert block.count(help_tail) == 1
          block = block.replace(
              help_tail,
              help_tail
              + '    lifecycle_source = (\n'
              + '        Path(__file__).resolve().parents[1]\n'
              + '        / "src" / "picture_capture" / "ui" / "settings" / "lifecycle.py"\n'
              + '    ).read_text(encoding="utf-8")\n',
              1,
          )
          for message in ("✓ 已自动保存", "⚠ 当前输入暂未保存"):
              old_assert = f'    assert "{message}" in settings'
              new_assert = f'    assert "{message}" in lifecycle_source'
              assert block.count(old_assert) == 1, (message, block.count(old_assert))
              block = block.replace(old_assert, new_assert, 1)
          tests = tests[:fn_start] + block + tests[fn_end:]
          tests_path.write_text(tests, encoding="utf-8", newline="\n")
          py_compile.compile(str(tests_path), doraise=True)

      - name: Check patch whitespace
        run: git diff --check

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove one-shot workflow and commit extraction
        shell: bash
        run: |
          rm .github/workflows/phase3_extract_settings_lifecycle_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/picture_capture/app.py scripts/architecture_guard.py tests/test_next_stage_regressions.py .github/workflows/phase3_extract_settings_lifecycle_once.yml
          git commit -m "refactor: route Settings lifecycle through helper"
          git push origin HEAD:refactor/phase3-settings-lifecycle-behavior
