name: Phase 4L one-shot migration

on:
  push:
    branches: [refactor/phase4l-selected-scope-crop-fix]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase4l-selected-scope-crop-fix

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Complete Phase 4L app wiring
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          root = Path.cwd()
          app_path = root / "src/picture_capture/app.py"
          guard_path = root / "scripts/architecture_guard.py"
          text = app_path.read_text(encoding="utf-8")

          tree = ast.parse(text)
          app_class = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "PictureCaptureApp"
          )
          method = next(
              node for node in app_class.body
              if isinstance(node, ast.FunctionDef) and node.name == "split_entries_selected_scope"
          )
          assert method.end_lineno is not None
          old_method = "".join(text.splitlines(keepends=True)[method.lineno - 1:method.end_lineno])
          assert "self.selected_page_indices()" in old_method
          assert "self._ppp_read_path(page)" in old_method
          assert "_guard_transformed_geometry" not in old_method
          assert "split_whole_entries_job" in old_method

          lines = text.splitlines(keepends=True)
          wrapper = '''    def split_entries_selected_scope(self) -> None:\n        self._crop_controller_for_call().split_entries_selected_scope()\n'''
          lines[method.lineno - 1:method.end_lineno] = wrapper.splitlines(keepends=True)
          text = "".join(lines)

          worker_import = "    split_whole_entries_job,\n"
          assert text.count(worker_import) == 1
          text = text.replace(worker_import, "", 1)

          ast.parse(text)
          assert "def detect_illustrations_selected_scope(self)" in text
          assert "def split_illustrations_selected_scope(self)" in text
          assert "def _start_parallel_batch_task(" in text
          assert '("词条切图", self.split_entries_selected_scope)' in text
          app_path.write_text(text, encoding="utf-8")

          new_size = len(app_path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n"))
          assert new_size < 871_742, f"app.py did not shrink: {new_size}"
          guard = guard_path.read_text(encoding="utf-8")
          assert '"app.py": 871_742,' in guard
          guard = guard.replace('"app.py": 871_742,', f'"app.py": {new_size:_},', 1)
          guard_path.write_text(guard, encoding="utf-8")
          print(f"Phase 4L app.py baseline: 871742 -> {new_size} bytes")

          # The live method snapshots AppSettings with replace(), but it has
          # always kept the crop-settings dictionary (including special_pages)
          # by reference. Do not accidentally turn this refactor into a deep-
          # snapshot behavior change; the dedicated test should mutate only the
          # settings object and verify the existing special-page override.
          test_path = root / "tests/test_ui_crop_controller_selected_scope.py"
          test_text = test_path.read_text(encoding="utf-8")
          mutation = '    app.crop_config["special_pages"]["page002"]["top_y"] = 999\n'
          assert test_text.count(mutation) == 1
          test_text = test_text.replace(mutation, "", 1)
          test_path.write_text(test_text, encoding="utf-8")
          PY

      - name: Run targeted Phase 4L tests
        run: uv run --locked pytest -q tests/test_ui_crop_controller_selected_scope.py tests/test_ui_crop_controller.py tests/test_architecture_baseline.py tests/test_next_stage_regressions.py tests/test_postproduction_single_line_runtime.py

      - name: Compile touched Python
        run: uv run --locked python -m py_compile src/picture_capture/app.py src/picture_capture/ui/controllers/crop.py tests/test_ui_crop_controller_selected_scope.py tests/test_ui_crop_controller.py

      - name: Check diff whitespace
        run: git diff --check

      - name: Run complete pytest suite
        run: uv run --locked pytest

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Commit validated migration and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/phase4l-one-shot.yml
          git config user.name "Picture Capture Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move selected-scope crop with geometry safety fix"
          git push origin HEAD:refactor/phase4l-selected-scope-crop-fix
