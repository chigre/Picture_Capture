name: Phase 3 one-shot Settings schema extraction

on:
  push:
    branches:
      - refactor/phase3-settings-schema

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-settings-schema

      - name: Extract SettingsDialog class metadata
        shell: python
        run: |
          import ast
          from pathlib import Path
          import py_compile
          import re
          import textwrap

          app_path = Path("src/picture_capture/app.py")
          text = app_path.read_text(encoding="utf-8")
          tree = ast.parse(text)
          cls = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "SettingsDialog"
          )

          expected = (
              "FIELDS", "PROFILE_FIELD_GROUPS", "PROFILE_CHECKS", "FIELD_GROUPS",
              "CHECK_GROUPS", "OCR_LANGUAGES", "SETTING_LABELS", "SETTING_HELP",
              "COMMON_FIELDS", "NORMAL_COMMON_FIELDS", "NORMAL_ADVANCED_FIELDS",
              "OCR_COMMON_FIELDS", "OCR_ADVANCED_FIELDS", "DISPLAY_FIELDS",
              "PROJECT_RUNTIME_FIELDS", "EXPERT_FIELDS", "SETTING_UNITS", "SETTING_SPIN",
              "SETTING_HELP_IMAGES", "SETTING_CHOICES", "CHECK_HELP", "NORMAL_CHECKS",
              "OCR_COMMON_CHECKS", "OCR_ADVANCED_CHECKS", "DISPLAY_STYLE_CHECKS",
              "DISPLAY_CHECKS",
          )
          allowed_names = {"str", "int", "float", "bool", "tuple", "list", "dict", "set"}
          assignments = []
          for node in cls.body:
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  break
              if isinstance(node, ast.Assign):
                  assert len(node.targets) == 1 and isinstance(node.targets[0], ast.Name), ast.dump(node)
                  name = node.targets[0].id
                  refs = {
                      child.id for child in ast.walk(node.value)
                      if isinstance(child, ast.Name)
                  } - allowed_names
                  assert not refs, (name, sorted(refs))
                  assignments.append((name, node))
              elif isinstance(node, ast.Expr) and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                  continue
              else:
                  raise AssertionError(f"unexpected pre-method node: {ast.dump(node)}")

          names = tuple(name for name, _node in assignments)
          assert names == expected, names
          assert len(assignments) == 26

          schema_path = Path("src/picture_capture/ui/settings/schema.py")
          assert not schema_path.exists(), "schema.py already exists"
          chunks = []
          for name, node in assignments:
              segment = ast.get_source_segment(text, node)
              assert segment and segment.lstrip().startswith(f"{name} =")
              chunks.append(textwrap.dedent(segment).rstrip())
          schema = (
              'from __future__ import annotations\n\n'
              '"""Static Settings Center metadata.\n\n'
              'The dialog keeps compatibility class attributes that reference these exact\n'
              'objects, while runtime extensions remain free to replace attributes on the\n'
              'dialog class without creating a dependency back into ``app.py``.\n'
              '"""\n\n'
              + '\n\n'.join(chunks)
              + '\n\n\n__all__ = [\n'
              + ''.join(f'    "{name}",\n' for name in expected)
              + ']\n'
          )
          schema_path.write_text(schema, encoding="utf-8", newline="\n")
          py_compile.compile(str(schema_path), doraise=True)

          # Replace only the audited class-level assignments with compatibility aliases.
          lines = text.splitlines(keepends=True)
          first = assignments[0][1]
          last = assignments[-1][1]
          replacement = [f"    {name} = _settings_schema.{name}\n" for name in expected]
          replacement.append("\n")
          lines[first.lineno - 1:last.end_lineno] = replacement
          text = ''.join(lines)

          import_anchor = "from .ui.text_wrap import (\n"
          import_line = "from .ui.settings import schema as _settings_schema\n"
          assert text.count(import_anchor) == 1
          assert import_line not in text
          text = text.replace(import_anchor, import_line + import_anchor, 1)

          for name in expected:
              assert text.count(f"    {name} = _settings_schema.{name}") == 1
          assert "class SettingsDialog(tk.Toplevel):" in text
          app_path.write_text(text, encoding="utf-8", newline="\n")
          py_compile.compile(str(app_path), doraise=True)

          # Ratchet app.py debt to the reduced normalized source size.
          normalized_size = len(
              app_path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          )
          guard_path = Path("scripts/architecture_guard.py")
          guard = guard_path.read_text(encoding="utf-8")
          match = re.search(r'("app\.py":\s*)([0-9_]+)(,)', guard)
          assert match
          old_size = int(match.group(2).replace("_", ""))
          assert normalized_size < old_size, (normalized_size, old_size)
          guard = guard[:match.start(2)] + f"{normalized_size:_}" + guard[match.end(2):]
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"Settings metadata: {len(expected)} attributes; app.py {old_size}->{normalized_size}")

      - name: Remove one-shot workflow and commit extraction
        shell: bash
        run: |
          rm .github/workflows/phase3_settings_schema_audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/picture_capture/app.py src/picture_capture/ui/settings/schema.py scripts/architecture_guard.py .github/workflows/phase3_settings_schema_audit.yml
          git commit -m "refactor: extract Settings Center metadata schema"
          git push origin HEAD:refactor/phase3-settings-schema
