name: One-time v2.14.0 tagger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: contains(github.event.head_commit.message, '[tag-v2.14.0]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create verified v2.14.0 tag
        env:
          TARGET_SHA: 410a060e773c853cbef32dfb85cf13cb799600d8
          RELEASE_TAG: v2.14.0
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; refusing to move or recreate it."
            exit 1
          fi

          git cat-file -e "${TARGET_SHA}^{commit}"
          PROJECT_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          PACKAGE_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("src/picture_capture/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', text)
          if not match:
              raise SystemExit("Could not read package __version__")
          print(match.group(1))
          PY
          )"

          if [ "${PROJECT_VERSION}" != "2.14.0" ] || [ "${PACKAGE_VERSION}" != "2.14.0" ]; then
            echo "Version mismatch: pyproject=${PROJECT_VERSION}, package=${PACKAGE_VERSION}"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${TARGET_SHA}" -m "Picture Capture ${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
