name: Phase 4I one-shot migration

on:
  push:
    branches: [refactor/phase4i-crop-controller-single-line]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase4i-crop-controller-single-line

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Complete Phase 4I app wiring
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          root = Path.cwd()
          app_path = root / "src/picture_capture/app.py"
          guard_path = root / "scripts/architecture_guard.py"
          text = app_path.read_text(encoding="utf-8")

          old_import = '''from .ui.controllers import (\n    CanvasController, DetectionController, ExportController, PageController,\n    ProjectController, ReviewController, SESSION_STATE_FILENAME, SessionController,\n)'''
          new_import = '''from .ui.controllers import (\n    CanvasController, CropController, DetectionController, ExportController,\n    PageController, ProjectController, ReviewController, SESSION_STATE_FILENAME,\n    SessionController,\n)'''
          assert text.count(old_import) == 1, "controller import block drifted"
          text = text.replace(old_import, new_import, 1)

          init_needle = "        self.canvas_controller = CanvasController(self)\n"
          assert text.count(init_needle) == 1, "controller initialization seam drifted"
          text = text.replace(
              init_needle,
              init_needle + "        self.crop_controller = CropController(self)\n",
              1,
          )

          tree = ast.parse(text)
          app_class = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "PictureCaptureApp"
          )
          method = next(
              node for node in app_class.body
              if isinstance(node, ast.FunctionDef) and node.name == "split_lines_current"
          )
          assert method.end_lineno is not None
          lines = text.splitlines(keepends=True)
          wrapper = '''    def _crop_controller_for_call(self) -> CropController:\n        controller = self.__dict__.get("crop_controller")\n        if controller is None:\n            controller = CropController(self)\n            self.__dict__["crop_controller"] = controller\n        return controller\n\n    def split_lines_current(self) -> None:\n        self._crop_controller_for_call().split_lines_current()\n'''
          lines[method.lineno - 1:method.end_lineno] = wrapper.splitlines(keepends=True)
          text = "".join(lines)
          ast.parse(text)
          assert "def split_whole_current(self)" in text
          app_path.write_text(text, encoding="utf-8")

          new_size = len(app_path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n"))
          assert new_size < 876_797, f"app.py did not shrink: {new_size}"
          guard = guard_path.read_text(encoding="utf-8")
          assert '"app.py": 876_797,' in guard
          guard = guard.replace('"app.py": 876_797,', f'"app.py": {new_size:_},', 1)
          guard_path.write_text(guard, encoding="utf-8")
          print(f"Phase 4I app.py baseline: 876797 -> {new_size} bytes")
          PY

      - name: Align source-shape regressions with controller boundary
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          legacy_path = root / "tests/test_next_stage_regressions.py"
          legacy = legacy_path.read_text(encoding="utf-8")
          old_case = '        ("split_lines_current", "split_whole_current"),\n'
          assert legacy.count(old_case) == 1, "legacy long-tail source-shape case drifted"
          legacy = legacy.replace(old_case, "", 1)
          legacy_path.write_text(legacy, encoding="utf-8")

          crop_test_path = root / "tests/test_ui_crop_controller.py"
          crop_test = crop_test_path.read_text(encoding="utf-8")
          old_assert = '    assert "split_single_lines_selected_scope" not in controller\n'
          new_assert = '''    tree = ast.parse(controller)\n    crop_class = next(\n        node for node in tree.body\n        if isinstance(node, ast.ClassDef) and node.name == "CropController"\n    )\n    method_names = {\n        node.name for node in crop_class.body if isinstance(node, ast.FunctionDef)\n    }\n    assert "split_single_lines_selected_scope" not in method_names\n'''
          assert crop_test.count(old_assert) == 1, "runtime-boundary assertion drifted"
          crop_test = crop_test.replace(old_assert, new_assert, 1)
          crop_test_path.write_text(crop_test, encoding="utf-8")
          PY

      - name: Run targeted Phase 4I tests
        run: uv run --locked pytest -q tests/test_ui_crop_controller.py tests/test_architecture_baseline.py tests/test_next_stage_regressions.py tests/test_postproduction_single_line_runtime.py

      - name: Compile touched Python
        run: uv run --locked python -m py_compile src/picture_capture/app.py src/picture_capture/ui/controllers/crop.py src/picture_capture/ui/controllers/__init__.py tests/test_ui_crop_controller.py tests/test_next_stage_regressions.py

      - name: Check diff whitespace
        run: git diff --check

      - name: Run complete pytest suite
        run: uv run --locked pytest

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Commit validated migration and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/phase4i-one-shot.yml
          git config user.name "Picture Capture Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route current-page single-line crop through CropController"
          git push origin HEAD:refactor/phase4i-crop-controller-single-line
