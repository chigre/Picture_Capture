name: Phase 5L final validation

on:
  push:
    branches:
      - refactor/phase-5l-windows-gpu-helper

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase-5l-windows-gpu-helper
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Verify final Phase 5L shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          guard = Path('scripts/architecture_guard.py').read_text(encoding='utf-8')
          assert '"windows_gpu.py",' not in guard
          assert '"windows_gpu_runtime.py",' not in guard
          assert Path('src/picture_capture/windows_gpu.py').is_file()
          assert not Path('src/picture_capture/windows_gpu_runtime.py').exists()

          for root in ('src', 'scripts'):
              for path in Path(root).rglob('*.py'):
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  if 'windows_gpu_runtime' in text:
                      raise SystemExit(f'legacy production reference remains: {path}')

          install_doc = Path('docs/ocr-install.md').read_text(encoding='utf-8')
          assert 'windows_gpu_runtime' not in install_doc
          assert 'src/picture_capture/windows_gpu.py' in install_doc
          PY

      - name: Architecture guard
        run: uv run --locked python scripts/architecture_guard.py

      - name: Focused regressions
        run: >-
          uv run --locked pytest -q
          tests/test_ocr_channel_runner_semantics.py
          tests/test_core.py::DictionaryProfileV2Tests::test_paddle_orientation_participates_in_cache_and_prediction
          tests/test_core.py::test_windows_ocr_installer_uses_thin_batch_and_locked_uv_profiles

      - name: Full suite
        run: uv run --locked pytest -q

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase5l-ratchet-validate.yml
          git diff --check

      - name: Publish final validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chigre3"
          git config user.email "guangdong.hu@gmail.com"
          git commit -m "Phase 5L: finalize Windows GPU runtime debt ratchet"
          git push origin HEAD:refactor/phase-5l-windows-gpu-helper
