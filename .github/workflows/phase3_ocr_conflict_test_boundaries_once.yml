name: Phase 3 one-shot ReviewWindow source-boundary migration

on:
  push:
    branches:
      - refactor/phase3-ocr-conflict-dialog

permissions:
  contents: write

jobs:
  migrate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-ocr-conflict-dialog

      - name: Point ReviewWindow source slices at the next remaining app class
        shell: python
        run: |
          from pathlib import Path
          import py_compile

          paths = [
              Path("tests/test_core.py"),
              Path("tests/test_next_stage_regressions.py"),
          ]
          old = '.index("class OCRConflictReviewDialog",'
          new = '.index("class CropSettingsDialog",'
          total = 0
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              total += count
              if count:
                  path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
              py_compile.compile(str(path), doraise=True)
              print(f"{path}: migrated {count} ReviewWindow boundary references")
          assert total == 29, f"expected 29 stale ReviewWindow boundaries, found {total}"

          # The extracted dialog's own source contract must remain pointed at its module.
          next_stage = paths[1].read_text(encoding="utf-8")
          assert 'conflict_source.index("class OCRConflictReviewDialog")' in next_stage

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove workflow and commit migrated tests
        shell: bash
        run: |
          rm .github/workflows/phase3_ocr_conflict_test_boundaries_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_core.py tests/test_next_stage_regressions.py .github/workflows/phase3_ocr_conflict_test_boundaries_once.yml
          git commit -m "test: align ReviewWindow source boundaries"
          git push origin HEAD:refactor/phase3-ocr-conflict-dialog
