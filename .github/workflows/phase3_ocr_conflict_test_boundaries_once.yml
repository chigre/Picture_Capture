name: Phase 3 one-shot OCR dialog source-contract repair

on:
  push:
    branches:
      - refactor/phase3-ocr-conflict-dialog

permissions:
  contents: write

jobs:
  repair-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-ocr-conflict-dialog

      - name: Restore extracted-dialog source contract
        shell: python
        run: |
          from pathlib import Path
          import py_compile

          core = Path("tests/test_core.py")
          next_stage = Path("tests/test_next_stage_regressions.py")
          stale = '.index("class OCRConflictReviewDialog",'
          for path in (core, next_stage):
              text = path.read_text(encoding="utf-8")
              assert stale not in text, f"stale ReviewWindow boundary remains in {path}"
              py_compile.compile(str(path), doraise=True)

          text = next_stage.read_text(encoding="utf-8")
          bad = 'conflict_source.index("class CropSettingsDialog")'
          good = 'conflict_source.index("class OCRConflictReviewDialog")'
          assert text.count(bad) == 1, f"expected one over-migrated dialog contract, got {text.count(bad)}"
          assert good not in text
          text = text.replace(bad, good, 1)
          next_stage.write_text(text, encoding="utf-8", newline="\n")
          repaired = next_stage.read_text(encoding="utf-8")
          assert repaired.count(good) == 1
          py_compile.compile(str(next_stage), doraise=True)

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/phase3_ocr_conflict_test_boundaries_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_next_stage_regressions.py .github/workflows/phase3_ocr_conflict_test_boundaries_once.yml
          git commit -m "test: preserve extracted OCR dialog source contract"
          git push origin HEAD:refactor/phase3-ocr-conflict-dialog
