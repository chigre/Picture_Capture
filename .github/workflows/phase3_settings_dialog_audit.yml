name: Phase 3 SettingsDialog behavior audit

on:
  push:
    branches:
      - refactor/phase3-settings-dialog-behavior

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase3-settings-dialog-behavior
      - name: Audit SettingsDialog method dependencies
        shell: python
        run: |
          import ast
          import builtins
          from collections import Counter
          from pathlib import Path

          path = Path("src/picture_capture/app.py")
          text = path.read_text(encoding="utf-8")
          tree = ast.parse(text)
          cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == "SettingsDialog")
          methods = [n for n in cls.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))]
          method_names = {n.name for n in methods}
          builtin_names = set(dir(builtins))

          print(f"CLASS_LINES={cls.lineno}-{cls.end_lineno}")
          print(f"METHOD_COUNT={len(methods)}")

          global_counter = Counter()
          parent_counter = Counter()
          self_call_counter = Counter()

          for fn in methods:
              locals_ = {a.arg for a in fn.args.args + fn.args.kwonlyargs}
              if fn.args.vararg:
                  locals_.add(fn.args.vararg.arg)
              if fn.args.kwarg:
                  locals_.add(fn.args.kwarg.arg)
              for node in ast.walk(fn):
                  if isinstance(node, (ast.Store, ast.Param)):
                      if isinstance(node, ast.Name):
                          locals_.add(node.id)
                  if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Store):
                      locals_.add(node.id)

              globals_ = set()
              parents = set()
              self_calls = set()
              for node in ast.walk(fn):
                  if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load):
                      if node.id not in locals_ and node.id not in builtin_names and node.id not in {"self", "super"}:
                          globals_.add(node.id)
                  if isinstance(node, ast.Attribute):
                      if isinstance(node.value, ast.Attribute) and isinstance(node.value.value, ast.Name):
                          if node.value.value.id == "self" and node.value.attr == "parent":
                              parents.add(node.attr)
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      if isinstance(node.func.value, ast.Name) and node.func.value.id == "self" and node.func.attr in method_names:
                          self_calls.add(node.func.attr)

              for name in globals_:
                  global_counter[name] += 1
              for name in parents:
                  parent_counter[name] += 1
              for name in self_calls:
                  self_call_counter[name] += 1

              print(
                  f"METHOD\t{fn.name}\tlines={fn.lineno}-{fn.end_lineno}\t"
                  f"globals={','.join(sorted(globals_)) or '-'}\t"
                  f"parent={','.join(sorted(parents)) or '-'}\t"
                  f"selfcalls={','.join(sorted(self_calls)) or '-'}"
              )

          print("TOP_GLOBALS=" + ";".join(f"{k}:{v}" for k,v in global_counter.most_common(40)))
          print("TOP_PARENT=" + ";".join(f"{k}:{v}" for k,v in parent_counter.most_common(40)))
          print("TOP_SELFCALLS=" + ";".join(f"{k}:{v}" for k,v in self_call_counter.most_common(40)))
