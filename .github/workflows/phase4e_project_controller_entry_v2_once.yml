name: Phase 4E one-shot ProjectController entry wiring v2

on:
  push:
    branches:
      - refactor/phase4e-project-controller-entry
    paths:
      - .github/workflows/phase4e_project_controller_entry_v2_once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase4e-project-controller-entry

      - name: Apply ProjectController wiring and remaining source-contract migration
        shell: python
        run: |
          from pathlib import Path
          import py_compile
          import textwrap

          workflow_path = Path(".github/workflows/phase4e_project_controller_entry_once.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          marker = (
              "      - name: Wire project entry through ProjectController\n"
              "        shell: python\n"
              "        run: |\n"
          )
          assert workflow.count(marker) == 1
          source = workflow.split(marker, 1)[1].split(
              "\n      - name: Check patch whitespace", 1
          )[0]
          exec(compile(textwrap.dedent(source), str(workflow_path) + ":wiring", "exec"), {})

          regression_path = Path("tests/test_next_stage_regressions.py")
          regression = regression_path.read_text(encoding="utf-8")
          old = (
              '    assert "ProjectProfileWizard(self, new_project=new_project)" in text\n'
              '    assert "launch_profile_setup=not existing_project" in text\n\n'
              '    profile_source = (\n'
          )
          new = (
              '    assert "ProjectProfileWizard(self, new_project=new_project)" in text\n'
              '    project_controller_source = (\n'
              '        Path(__file__).resolve().parents[1]\n'
              '        / "src" / "picture_capture" / "ui" / "controllers" / "project.py"\n'
              '    ).read_text(encoding="utf-8")\n'
              '    assert "launch_profile_setup=not existing_project" in project_controller_source\n\n'
              '    profile_source = (\n'
          )
          assert regression.count(old) == 1
          regression = regression.replace(old, new, 1)
          regression_path.write_text(regression, encoding="utf-8", newline="\n")
          py_compile.compile(str(regression_path), doraise=True)

      - name: Check patch whitespace
        run: git diff --check

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove one-shot workflows and commit ProjectController wiring
        shell: bash
        run: |
          rm .github/workflows/phase4e_project_controller_entry_once.yml
          rm .github/workflows/phase4e_project_controller_entry_v2_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/architecture_guard.py \
            src/picture_capture/app.py \
            src/picture_capture/ui/controllers/__init__.py \
            src/picture_capture/ui/controllers/project.py \
            tests/test_next_stage_regressions.py \
            tests/test_ui_project_controller.py \
            .github/workflows/phase4e_project_controller_entry_once.yml \
            .github/workflows/phase4e_project_controller_entry_v2_once.yml
          git commit -m "refactor: route project entry through ProjectController"
          git push origin HEAD:refactor/phase4e-project-controller-entry
