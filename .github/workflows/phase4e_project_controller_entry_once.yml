name: Phase 4E one-shot ProjectController entry wiring

on:
  push:
    branches:
      - refactor/phase4e-project-controller-entry
    paths:
      - .github/workflows/phase4e_project_controller_entry_once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase4e-project-controller-entry

      - name: Wire project entry through ProjectController
        shell: python
        run: |
          import ast
          from pathlib import Path
          import py_compile
          import re

          app_path = Path("src/picture_capture/app.py")
          init_path = Path("src/picture_capture/ui/controllers/__init__.py")
          controller_path = Path("src/picture_capture/ui/controllers/project.py")
          regression_path = Path("tests/test_next_stage_regressions.py")
          guard_path = Path("scripts/architecture_guard.py")

          app = app_path.read_text(encoding="utf-8")

          old_import = (
              "from .ui.controllers import (\n"
              "    CanvasController, PageController, SESSION_STATE_FILENAME, SessionController,\n"
              ")\n"
          )
          new_import = (
              "from .ui.controllers import (\n"
              "    CanvasController, PageController, ProjectController,\n"
              "    SESSION_STATE_FILENAME, SessionController,\n"
              ")\n"
          )
          assert app.count(old_import) == 1
          app = app.replace(old_import, new_import, 1)

          init_anchor = (
              "        self.canvas_controller = CanvasController(self)\n"
              "        self.page_controller = PageController(self)\n"
              "        self._build_ui()\n"
          )
          assert app.count(init_anchor) == 1
          app = app.replace(
              init_anchor,
              "        self.canvas_controller = CanvasController(self)\n"
              "        self.project_controller = ProjectController(self)\n"
              "        self.page_controller = PageController(self)\n"
              "        self._build_ui()\n",
              1,
          )

          tree = ast.parse(app)
          cls = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "PictureCaptureApp"
          )
          methods = {
              node.name: node
              for node in cls.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          assert "_choose_new_project_image_suffix" in methods
          assert "open_project" in methods

          helper_and_suffix = (
              "    def _project_controller_for_call(self) -> ProjectController:\n"
              "        controller = self.__dict__.get(\"project_controller\")\n"
              "        if controller is None:\n"
              "            controller = ProjectController(self)\n"
              "            self.__dict__[\"project_controller\"] = controller\n"
              "        return controller\n\n"
              "    def _choose_new_project_image_suffix(self, root: Path) -> str | None:\n"
              "        return self._project_controller_for_call().choose_new_project_image_suffix(root)\n\n"
          )
          open_wrapper = (
              "    def open_project(self) -> None:\n"
              "        self._project_controller_for_call().open_project()\n\n"
          )

          lines = app.splitlines(keepends=True)
          spans = []
          for name, replacement in (
              ("_choose_new_project_image_suffix", helper_and_suffix),
              ("open_project", open_wrapper),
          ):
              node = methods[name]
              start = min([node.lineno] + [d.lineno for d in node.decorator_list]) - 1
              end = node.end_lineno
              spans.append((start, end, replacement))
          for start, end, replacement in sorted(spans, reverse=True):
              lines[start:end] = replacement.splitlines(keepends=True)
          app = "".join(lines)
          app_path.write_text(app, encoding="utf-8", newline="\n")

          controllers_init = init_path.read_text(encoding="utf-8")
          old_init = (
              '"""Explicit controllers coordinating Picture Capture UI workflows."""\n\n'
              "from .canvas import CanvasController\n"
              "from .page import PageController\n"
              "from .session import SESSION_STATE_FILENAME, SessionController\n\n"
              '__all__ = [\n'
              '    "CanvasController", "PageController", "SessionController", "SESSION_STATE_FILENAME",\n'
              ']\n'
          )
          new_init = (
              '"""Explicit controllers coordinating Picture Capture UI workflows."""\n\n'
              "from .canvas import CanvasController\n"
              "from .page import PageController\n"
              "from .project import ProjectController\n"
              "from .session import SESSION_STATE_FILENAME, SessionController\n\n"
              '__all__ = [\n'
              '    "CanvasController", "PageController", "ProjectController",\n'
              '    "SessionController", "SESSION_STATE_FILENAME",\n'
              ']\n'
          )
          assert controllers_init == old_init
          init_path.write_text(new_init, encoding="utf-8", newline="\n")

          # Move the implementation-location assertions with the implementation.
          regression = regression_path.read_text(encoding="utf-8")
          start_anchor = (
              '    suffix_choice_start = text.index("    def _choose_new_project_image_suffix(")\n'
          )
          end_anchor = '    assert "if requested_suffix is None:" in open_project\n'
          assert regression.count(start_anchor) == 1
          block_start = regression.index(start_anchor)
          block_end = regression.index(end_anchor, block_start) + len(end_anchor)
          replacement = (
              '    controller_source = (\n'
              '        Path(__file__).resolve().parents[1]\n'
              '        / "src" / "picture_capture" / "ui" / "controllers" / "project.py"\n'
              '    ).read_text(encoding="utf-8")\n'
              '    suffix_choice_start = controller_source.index("    def choose_new_project_image_suffix(")\n'
              '    suffix_choice_end = controller_source.index("\\n    def open_project(", suffix_choice_start)\n'
              '    suffix_choice = controller_source[suffix_choice_start:suffix_choice_end]\n'
              '    assert "project_page_images(root)" in suffix_choice\n'
              '    assert "simpledialog.askstring(" in suffix_choice\n'
              '    open_start = controller_source.index("    def open_project(self) -> None:")\n'
              '    open_project = controller_source[open_start:]\n'
              '    assert "if not existing_project:" in open_project\n'
              '    assert "self.choose_new_project_image_suffix(root)" in open_project\n'
              '    assert "if requested_suffix is None:" in open_project\n'
              '    assert "def _choose_new_project_image_suffix(" in text\n'
              '    assert "self._project_controller_for_call().choose_new_project_image_suffix(root)" in text\n'
              '    assert "def open_project(self) -> None:" in text\n'
              '    assert "self._project_controller_for_call().open_project()" in text\n'
          )
          regression = regression[:block_start] + replacement + regression[block_end:]
          regression_path.write_text(regression, encoding="utf-8", newline="\n")

          updated = app_path.read_text(encoding="utf-8")
          assert updated.count("self.project_controller = ProjectController(self)") == 1
          assert updated.index("self.project_controller = ProjectController(self)") < updated.index("self._build_ui()")
          assert 'self.__dict__.get("project_controller")' in updated
          assert "self._project_controller_for_call().choose_new_project_image_suffix(root)" in updated
          assert "self._project_controller_for_call().open_project()" in updated
          assert "project_page_images(root)" not in updated

          controller = controller_path.read_text(encoding="utf-8")
          controller_tree = ast.parse(controller)
          for node in ast.walk(controller_tree):
              if isinstance(node, ast.Import):
                  assert all(alias.name != "picture_capture.app" for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  assert node.module not in {"app", "picture_capture.app"}

          py_compile.compile(str(app_path), doraise=True)
          py_compile.compile(str(init_path), doraise=True)
          py_compile.compile(str(controller_path), doraise=True)
          py_compile.compile(str(regression_path), doraise=True)

          final_size = len(app_path.read_bytes())
          guard = guard_path.read_text(encoding="utf-8")
          pattern = r'(    "app\.py": )\d[\d_]*(,)'
          assert len(re.findall(pattern, guard)) == 1
          rendered = f"{final_size:,}".replace(",", "_")
          guard = re.sub(pattern, rf'\g<1>{rendered}\2', guard, count=1)
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"FINAL_APP_BYTES={final_size}")

      - name: Check patch whitespace
        run: git diff --check

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove one-shot workflow and commit ProjectController wiring
        shell: bash
        run: |
          rm .github/workflows/phase4e_project_controller_entry_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/architecture_guard.py \
            src/picture_capture/app.py \
            src/picture_capture/ui/controllers/__init__.py \
            src/picture_capture/ui/controllers/project.py \
            tests/test_next_stage_regressions.py \
            tests/test_ui_project_controller.py \
            .github/workflows/phase4e_project_controller_entry_once.yml
          git commit -m "refactor: route project entry through ProjectController"
          git push origin HEAD:refactor/phase4e-project-controller-entry
