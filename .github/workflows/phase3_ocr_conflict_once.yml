name: Phase 3 one-shot OCR conflict dialog extraction

on:
  push:
    branches:
      - refactor/phase3-ocr-conflict-dialog

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-ocr-conflict-dialog

      - name: Extract OCRConflictReviewDialog from app.py
        shell: python
        run: |
          from pathlib import Path
          import py_compile
          import re

          app_path = Path("src/picture_capture/app.py")
          text = app_path.read_text(encoding="utf-8")
          start_token = "\nclass OCRConflictReviewDialog(tk.Toplevel):"
          end_token = "\nclass CropSettingsDialog(tk.Toplevel):"
          assert text.count(start_token) == 1, "OCR conflict dialog start boundary changed"
          assert text.count(end_token) == 1, "CropSettingsDialog boundary changed"
          start = text.index(start_token)
          end = text.index(end_token, start)
          extracted = text[start + 1:end]
          for contract in (
              'class OCRConflictReviewDialog(tk.Toplevel):',
              'def refresh(self) -> None:',
              'def toggle_selected(self) -> None:',
              'def choose_engine(self, engine: str) -> None:',
              'def choose_manual(self) -> None:',
              'self.parent.jump_to_review_candidate(cand)',
              'self.parent.apply_candidate_choice(cand, engine',
          ):
              assert contract in extracted, f"missing OCR conflict contract: {contract}"
          assert extracted.count('parent: "PictureCaptureApp"') == 1
          extracted = extracted.replace('parent: "PictureCaptureApp"', 'parent: tk.Misc', 1)

          module_header = '''from __future__ import annotations\n\nimport tkinter as tk\nfrom tkinter import messagebox, simpledialog, ttk\n\nfrom ...ui_compat import fit_window_to_work_area\nfrom .common import _build_modern_dialog_heading\n\n\n'''
          module_path = Path("src/picture_capture/ui/dialogs/ocr_conflict.py")
          assert not module_path.exists(), "ocr_conflict.py already exists"
          module_path.write_text(
              module_header + extracted.rstrip() + '\n\n\n__all__ = ["OCRConflictReviewDialog"]\n',
              encoding="utf-8", newline="\n",
          )

          # Delete first, then insert the compatibility import so offsets stay valid.
          text = text[:start] + "\n" + text[end:]
          anchor = "from .ui.dialogs.old_new_comparison import OldNewComparisonWindow\n"
          dialog_import = "from .ui.dialogs.ocr_conflict import OCRConflictReviewDialog\n"
          assert text.count(anchor) == 1, "old/new dialog import anchor changed"
          assert dialog_import not in text
          text = text.replace(anchor, anchor + dialog_import, 1)
          assert "class OCRConflictReviewDialog(tk.Toplevel):" not in text
          assert text.count(dialog_import) == 1
          app_path.write_text(text, encoding="utf-8", newline="\n")

          init_path = Path("src/picture_capture/ui/dialogs/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          old_init = '''from .old_new_comparison import OldNewComparisonWindow\nfrom .usage_guide import UsageGuideWindow\n\n__all__ = ["OldNewComparisonWindow", "UsageGuideWindow"]\n'''
          new_init = '''from .ocr_conflict import OCRConflictReviewDialog\nfrom .old_new_comparison import OldNewComparisonWindow\nfrom .usage_guide import UsageGuideWindow\n\n__all__ = ["OCRConflictReviewDialog", "OldNewComparisonWindow", "UsageGuideWindow"]\n'''
          assert init_text.count(old_init) == 1, "dialogs package exports changed"
          init_path.write_text(init_text.replace(old_init, new_init, 1), encoding="utf-8", newline="\n")

          # Preserve existing source-contract coverage after the class moves.
          test_path = Path("tests/test_next_stage_regressions.py")
          tests = test_path.read_text(encoding="utf-8")
          old_review = '    review_end = source.index("class OCRConflictReviewDialog", review_start)\n'
          new_review = '    review_end = source.index("class CropSettingsDialog", review_start)\n'
          assert tests.count(old_review) == 1, "ReviewWindow source boundary changed"
          tests = tests.replace(old_review, new_review, 1)

          old_conflict = '''    conflict_start = source.index("class OCRConflictReviewDialog")\n    conflict_end = source.index("class CropSettingsDialog", conflict_start)\n    conflict = source[conflict_start:conflict_end]\n'''
          new_conflict = '''    conflict_source = (\n        Path(__file__).resolve().parents[1]\n        / "src" / "picture_capture" / "ui" / "dialogs" / "ocr_conflict.py"\n    ).read_text(encoding="utf-8")\n    conflict_start = conflict_source.index("class OCRConflictReviewDialog")\n    conflict = conflict_source[conflict_start:]\n'''
          assert tests.count(old_conflict) == 1, "OCR conflict source contract changed"
          tests = tests.replace(old_conflict, new_conflict, 1)
          test_path.write_text(tests, encoding="utf-8", newline="\n")

          normalized_size = len(app_path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n"))
          guard_path = Path("scripts/architecture_guard.py")
          guard = guard_path.read_text(encoding="utf-8")
          match = re.search(r'("app\.py":\s*)([0-9_]+)(,)', guard)
          assert match, "app.py architecture baseline not found"
          old_size = int(match.group(2).replace("_", ""))
          assert normalized_size < old_size, (normalized_size, old_size)
          guard = guard[:match.start(2)] + f"{normalized_size:_}" + guard[match.end(2):]
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"app.py architecture baseline: {old_size} -> {normalized_size}")

          for path in (
              app_path,
              module_path,
              init_path,
              test_path,
              Path("tests/test_ui_ocr_conflict_dialog.py"),
          ):
              py_compile.compile(str(path), doraise=True)

      - name: Verify architecture guard
        run: python scripts/architecture_guard.py

      - name: Remove one-shot workflow and commit extraction
        shell: bash
        run: |
          rm .github/workflows/phase3_ocr_conflict_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/picture_capture/app.py src/picture_capture/ui/dialogs tests/test_next_stage_regressions.py tests/test_ui_ocr_conflict_dialog.py scripts/architecture_guard.py .github/workflows/phase3_ocr_conflict_once.yml
          git commit -m "refactor: extract OCR conflict review dialog"
          git push origin HEAD:refactor/phase3-ocr-conflict-dialog
