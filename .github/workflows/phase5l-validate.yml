name: Phase 5L validation

on:
  push:
    branches:
      - refactor/phase-5l-windows-gpu-helper

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase-5l-windows-gpu-helper
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Apply Phase 5L migration
        run: uv run --locked python tools/phase5l_apply.py

      - name: Check diff shape
        shell: bash
        run: |
          set -euo pipefail
          git add -N src/picture_capture/windows_gpu.py
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'docs/ocr-install.md',
              'scripts/architecture_guard.py',
              'scripts/verify_ocr_environment.py',
              'src/picture_capture/document_unwarping.py',
              'src/picture_capture/layout_detection_legacy.py',
              'src/picture_capture/ocr_channel.py',
              'src/picture_capture/paddle_headwords_core.py',
              'src/picture_capture/windows_gpu.py',
              'src/picture_capture/windows_gpu_runtime.py',
              'tests/test_core.py',
              'tests/test_ocr_channel_runner_semantics.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--no-renames', '--name-only'], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected Phase 5L diff: {sorted(changed)}')
          PY

      - name: Architecture guard
        run: uv run --locked python scripts/architecture_guard.py

      - name: Focused regressions
        run: >-
          uv run --locked pytest -q
          tests/test_ocr_channel_runner_semantics.py
          tests/test_core.py::DictionaryProfileV2Tests::test_paddle_orientation_participates_in_cache_and_prediction
          tests/test_core.py::test_windows_ocr_installer_uses_thin_batch_and_locked_uv_profiles

      - name: Full suite
        run: uv run --locked pytest -q

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Remove temporary migration assets
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/phase5l_apply.py .github/workflows/phase5l-validate.yml
          git diff --check

      - name: Publish validated production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chigre3"
          git config user.email "guangdong.hu@gmail.com"
          git add docs scripts src tests
          git commit -m "Phase 5L: rename Windows GPU helper"
          git push origin HEAD:refactor/phase-5l-windows-gpu-helper
