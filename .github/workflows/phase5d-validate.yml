name: Phase 5D isolated validation

on:
  push:
    branches: [refactor/phase-5d-single-line-batch-runner]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Apply Phase 5D patch
        run: python tools/phase5d_apply.py

      - name: Check patch shape
        run: |
          git diff --check
          git status --short

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run focused regressions
        run: >-
          uv run --locked pytest -q
          tests/test_postproduction_single_line_runtime.py
          tests/test_single_line_parallel.py
          tests/test_ui_crop_controller.py
          tests/test_ui_crop_controller_selected_scope.py
          tests/test_unlined_line_export.py
          tests/test_next_stage_regressions.py
          tests/test_ui_illustration_controller.py
          tests/test_ui_illustration_crop_controller.py

      - name: Run full suite
        run: uv run --locked pytest -q

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Remove migration assets
        run: |
          rm tools/phase5d_apply.py
          rm .github/workflows/phase5d-validate.yml
          git diff --check

      - name: Publish validated production tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route single-line export through shared batch runner"
          git push origin HEAD:refactor/phase-5d-single-line-batch-runner
