name: Phase 4K one-shot migration

on:
  push:
    branches: [refactor/phase4k-crop-controller-batch-whole]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase4k-crop-controller-batch-whole

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Complete Phase 4K app wiring and source-boundary update
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          root = Path.cwd()
          app_path = root / "src/picture_capture/app.py"
          guard_path = root / "scripts/architecture_guard.py"
          legacy_test_path = root / "tests/test_next_stage_regressions.py"

          text = app_path.read_text(encoding="utf-8")
          tree = ast.parse(text)
          app_class = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "PictureCaptureApp"
          )
          method = next(
              node for node in app_class.body
              if isinstance(node, ast.FunctionDef) and node.name == "batch_split_whole"
          )
          assert method.end_lineno is not None
          original = "".join(text.splitlines(keepends=True)[method.lineno - 1:method.end_lineno])
          assert 'self._start_batch_task("批量整体切图"' in original
          assert 'read_pdic(pdic_path(page))' in original
          assert 'read_ppp(ppp_read_path_for_image(page))' in original
          assert 'split_whole_entries(' in original

          lines = text.splitlines(keepends=True)
          wrapper = '''    def batch_split_whole(self) -> None:\n        self._crop_controller_for_call().batch_split_whole()\n'''
          lines[method.lineno - 1:method.end_lineno] = wrapper.splitlines(keepends=True)
          text = "".join(lines)
          ast.parse(text)
          assert "def repair_pdic_order_selected_scope(self)" in text
          assert "def _crop_settings_defaults(self)" in text
          app_path.write_text(text, encoding="utf-8")

          new_size = len(app_path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n"))
          assert new_size < 873_916, f"app.py did not shrink: {new_size}"
          guard = guard_path.read_text(encoding="utf-8")
          assert '"app.py": 873_916,' in guard
          guard = guard.replace('"app.py": 873_916,', f'"app.py": {new_size:_},', 1)
          guard_path.write_text(guard, encoding="utf-8")

          legacy = legacy_test_path.read_text(encoding="utf-8")
          start_marker = '    split_start = app.index("    def batch_split_whole(")'
          end_marker = '    restore_start = app.index("    def restore_from_pdic_backup(")'
          start = legacy.index(start_marker)
          end = legacy.index(end_marker, start)
          replacement = '''    crop_source = (\n        root / "src" / "picture_capture" / "ui" / "controllers" / "crop.py"\n    ).read_text(encoding="utf-8")\n    split_start = crop_source.index("    def batch_split_whole(")\n    split = crop_source[split_start:]\n    worker = split[\n        split.index("        def worker("):\n        split.index("        def done(", split.index("        def worker("))\n    ]\n    assert "app._ppp_read_path" not in worker\n    assert "ppp_read_path_for_image(page)" in worker\n\n'''
          legacy = legacy[:start] + replacement + legacy[end:]
          legacy_test_path.write_text(legacy, encoding="utf-8")

          print(f"Phase 4K app.py baseline: 873916 -> {new_size} bytes")
          PY

      - name: Run targeted Phase 4K tests
        run: uv run --locked pytest -q tests/test_ui_crop_controller.py tests/test_architecture_baseline.py tests/test_next_stage_regressions.py tests/test_postproduction_single_line_runtime.py tests/test_ui_crop_settings_dialog.py tests/test_ui_settings_crop.py tests/test_refactor_behavior_baseline.py

      - name: Compile touched Python
        run: uv run --locked python -m py_compile src/picture_capture/app.py src/picture_capture/ui/controllers/crop.py tests/test_ui_crop_controller.py tests/test_next_stage_regressions.py

      - name: Check diff whitespace
        run: git diff --check

      - name: Run complete pytest suite
        run: uv run --locked pytest

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Commit validated migration and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/phase4k-one-shot.yml
          git config user.name "Picture Capture Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route batch whole-entry crop through CropController"
          git push origin HEAD:refactor/phase4k-crop-controller-batch-whole
