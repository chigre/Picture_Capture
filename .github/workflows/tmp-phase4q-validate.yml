name: Temporary Phase 4Q validation

on:
  push:
    branches:
      - refactor/phase4q-picdic-index-entry

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 4Q branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase4q-picdic-index-entry

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Apply narrow Phase 4Q patch
        run: |
          uv run --locked python tools/tmp_phase4q_patch.py
          uv run --locked python tools/tmp_phase4q_finalize.py
          uv run --locked python tools/tmp_phase4q_testfix.py

      - name: Check diff and focused regressions
        run: |
          git diff --check
          uv run --locked pytest -q tests/test_ui_export_controller.py tests/test_next_stage_regressions.py tests/test_core.py

      - name: Run full suite and static gates
        run: |
          uv run --locked pytest -q
          uv run --locked python -m compileall -q src scripts run.py run_tests.py
          uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py
          wc -c src/picture_capture/app.py

      - name: Commit validated Phase 4Q branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/picture_capture/app.py src/picture_capture/ui/controllers/export.py tests/test_ui_export_controller.py tests/test_core.py
          git rm tools/tmp_phase4q_patch.py tools/tmp_phase4q_finalize.py tools/tmp_phase4q_testfix.py .github/workflows/tmp-phase4q-validate.yml
          git commit -m "Phase 4Q: route PicDic index export through ExportController"
          git push origin HEAD:refactor/phase4q-picdic-index-entry
