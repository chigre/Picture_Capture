name: Phase 3 one-shot Settings profile extraction

on:
  push:
    branches:
      - refactor/phase3-settings-profile-behavior

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-settings-profile-behavior

      - name: Extract Settings profile state methods
        shell: python
        run: |
          import ast
          from pathlib import Path
          import py_compile
          import textwrap

          app_path = Path("src/picture_capture/app.py")
          guard_path = Path("scripts/architecture_guard.py")
          profile_path = Path("src/picture_capture/ui/settings/profile.py")

          text = app_path.read_text(encoding="utf-8")
          import_anchor = "from .ui.settings import help as _settings_help_ui\n"
          assert text.count(import_anchor) == 1
          assert "from .ui.settings import profile as _settings_profile_ui" not in text
          text = text.replace(
              import_anchor,
              import_anchor + "from .ui.settings import profile as _settings_profile_ui\n",
              1,
          )

          tree = ast.parse(text)
          cls = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "SettingsDialog"
          )
          methods = [
              node for node in cls.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          target_names = [
              "_build_profile_choice_labels",
              "_profile_label_for_key",
              "_profile_display_name",
              "_sync_custom_profile_name_state",
              "_on_custom_profile_name_changed",
              "_current_profile_key",
              "_refresh_profile_summary",
              "_coerce_profile_var",
              "_refresh_profile_status",
              "_apply_profile_defaults_to_vars",
              "_on_profile_selected",
              "restore_profile_defaults",
              "_on_profile_language_changed",
              "_sync_layout_semantics",
              "_refresh_sort_choices",
              "_toggle_custom_sort_state",
          ]
          method_map = {node.name: node for node in methods}
          first_index = next(i for i, node in enumerate(methods) if node.name == target_names[0])
          assert [node.name for node in methods[first_index:first_index + len(target_names)]] == target_names
          assert methods[first_index + len(target_names)].name == "_browse_wordslist_setting"

          wrapper_source = textwrap.dedent('''
          def _build_profile_choice_labels(self) -> dict[str, str]:
              return _settings_profile_ui.build_profile_choice_labels(self)

          def _profile_label_for_key(self, key: str) -> str:
              return _settings_profile_ui.profile_label_for_key(self, key)

          def _profile_display_name(self, key: str) -> str:
              return _settings_profile_ui.profile_display_name(self, key)

          def _sync_custom_profile_name_state(self) -> None:
              _settings_profile_ui.sync_custom_profile_name_state(self)

          def _on_custom_profile_name_changed(self) -> None:
              _settings_profile_ui.on_custom_profile_name_changed(self)

          def _current_profile_key(self) -> str:
              return _settings_profile_ui.current_profile_key(self)

          def _refresh_profile_summary(self) -> None:
              _settings_profile_ui.refresh_profile_summary(self)

          def _coerce_profile_var(self, name: str):
              return _settings_profile_ui.coerce_profile_var(self, name)

          def _refresh_profile_status(self) -> None:
              _settings_profile_ui.refresh_profile_status(self)

          def _apply_profile_defaults_to_vars(
              self,
              key: str,
              *,
              keep_supported_language: bool = True,
          ) -> None:
              _settings_profile_ui.apply_profile_defaults_to_vars(
                  self,
                  key,
                  keep_supported_language=keep_supported_language,
              )

          def _on_profile_selected(self, _event=None) -> None:
              _settings_profile_ui.on_profile_selected(self, _event)

          def restore_profile_defaults(self) -> None:
              _settings_profile_ui.restore_profile_defaults(self)

          def _on_profile_language_changed(self, update_profile_paddle: bool = True) -> None:
              _settings_profile_ui.on_profile_language_changed(
                  self, update_profile_paddle=update_profile_paddle
              )

          def _sync_layout_semantics(self) -> None:
              _settings_profile_ui.sync_layout_semantics(self)

          def _refresh_sort_choices(self, initial: bool = False) -> None:
              _settings_profile_ui.refresh_sort_choices(self, initial=initial)

          def _toggle_custom_sort_state(self) -> None:
              _settings_profile_ui.toggle_custom_sort_state(self)
          ''').lstrip("\n")
          wrappers = textwrap.indent(wrapper_source, "    ") + "\n"

          first = method_map[target_names[0]]
          next_method = method_map["_browse_wordslist_setting"]
          lines = text.splitlines(keepends=True)
          text = (
              "".join(lines[: first.lineno - 1])
              + wrappers
              + "".join(lines[next_method.lineno - 1 :])
          )
          app_path.write_text(text, encoding="utf-8", newline="\n")

          py_compile.compile(str(app_path), doraise=True)
          py_compile.compile(str(profile_path), doraise=True)

          size = len(app_path.read_bytes())
          guard = guard_path.read_text(encoding="utf-8")
          old = '    "app.py": 932_928,'
          assert guard.count(old) == 1
          rendered = f"{size:,}".replace(",", "_")
          guard = guard.replace(old, f'    "app.py": {rendered},', 1)
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"APP_BYTES={size}")

      - name: Check patch whitespace
        run: git diff --check

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove one-shot workflow and commit extraction
        shell: bash
        run: |
          rm .github/workflows/phase3_extract_settings_profile_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/picture_capture/app.py scripts/architecture_guard.py .github/workflows/phase3_extract_settings_profile_once.yml
          git commit -m "refactor: route Settings profile state through helper"
          git push origin HEAD:refactor/phase3-settings-profile-behavior
