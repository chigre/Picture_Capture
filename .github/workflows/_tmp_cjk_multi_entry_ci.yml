name: Temporary CJK Multi Entry Validation

on:
  push:
    branches:
      - fix/cjk-multi-entry-profile-defaults

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Focused CJK/Profile regressions
        run: uv run --locked pytest -q tests/test_next_stage_regressions.py
      - name: Full pytest
        run: uv run --locked pytest -q
      - name: Compile
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py
      - name: Undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py
