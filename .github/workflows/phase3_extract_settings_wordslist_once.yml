name: Phase 3 one-shot Settings wordslist extraction

on:
  push:
    branches:
      - refactor/phase3-settings-wordslist-behavior

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase3-settings-wordslist-behavior

      - name: Extract Settings wordslist browser
        shell: python
        run: |
          import ast
          from pathlib import Path
          import py_compile
          import textwrap

          app_path = Path("src/picture_capture/app.py")
          guard_path = Path("scripts/architecture_guard.py")
          helper_path = Path("src/picture_capture/ui/settings/project.py")

          text = app_path.read_text(encoding="utf-8")
          assert "from .ui.settings import project as _settings_project_ui" in text

          tree = ast.parse(text)
          cls = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "SettingsDialog"
          )
          methods = [
              node for node in cls.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          method_map = {node.name: node for node in methods}
          target = method_map["_browse_wordslist_setting"]
          target_index = next(i for i, node in enumerate(methods) if node.name == target.name)
          assert methods[target_index + 1].name == "_rules_path"

          wrapper_source = textwrap.dedent('''
          def _browse_wordslist_setting(self, var: tk.StringVar) -> None:
              _settings_project_ui.browse_wordslist_setting(self, var)
          ''').lstrip("\n")
          wrapper = textwrap.indent(wrapper_source, "    ") + "\n"

          next_method = method_map["_rules_path"]
          lines = text.splitlines(keepends=True)
          text = (
              "".join(lines[: target.lineno - 1])
              + wrapper
              + "".join(lines[next_method.lineno - 1 :])
          )
          app_path.write_text(text, encoding="utf-8", newline="\n")

          py_compile.compile(str(app_path), doraise=True)
          py_compile.compile(str(helper_path), doraise=True)

          size = len(app_path.read_bytes())
          guard = guard_path.read_text(encoding="utf-8")
          old = '    "app.py": 908_948,'
          assert guard.count(old) == 1
          rendered = f"{size:,}".replace(",", "_")
          guard = guard.replace(old, f'    "app.py": {rendered},', 1)
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"APP_BYTES={size}")

      - name: Check patch whitespace
        run: git diff --check

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove one-shot workflow and commit extraction
        shell: bash
        run: |
          rm .github/workflows/phase3_extract_settings_wordslist_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/picture_capture/app.py scripts/architecture_guard.py .github/workflows/phase3_extract_settings_wordslist_once.yml
          git commit -m "refactor: route Settings wordslist browser through project helper"
          git push origin HEAD:refactor/phase3-settings-wordslist-behavior
