name: Temporary Phase 4P final validation

on:
  push:
    branches:
      - refactor/phase4p-picdic-build-entry

permissions:
  contents: write

jobs:
  validate-final-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase4p-picdic-build-entry

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Apply missing source-boundary test update
        run: uv run --locked python tools/tmp_phase4p_finalize.py

      - name: Validate focused suite
        run: uv run --locked pytest -q tests/test_ui_export_controller.py tests/test_ui_illustration_crop_controller.py tests/test_next_stage_regressions.py

      - name: Validate full suite and static checks
        run: |
          uv run --locked pytest -q
          git diff --check
          uv run --locked python -m compileall -q src scripts run.py run_tests.py
          uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py
          wc -c src/picture_capture/app.py

      - name: Commit final validated test boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_next_stage_regressions.py
          git rm tools/tmp_phase4p_finalize.py .github/workflows/tmp-phase4p-finalize.yml
          git commit -m "Test Phase 4P controller boundary"
          git push origin HEAD:refactor/phase4p-picdic-build-entry
