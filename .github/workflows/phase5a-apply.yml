name: Phase 5A apply and validate

on:
  push:
    branches:
      - refactor/phase-5a-retire-ordinary-runtime
    paths:
      - .github/workflows/phase5a-apply.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install locked dev dependencies
        run: uv sync --locked --group dev
      - name: Apply Phase 5A migration
        run: |
          uv run --locked python tools/phase5a_apply.py
          uv run --locked python tools/phase5a_fix_app_wrapper.py
      - name: Check focused diff shape
        run: |
          git fetch origin main --depth=1
          git diff --check origin/main
          git diff --name-only origin/main
      - name: Run focused runtime/controller regressions
        run: >-
          uv run --locked pytest
          tests/test_ui_detection_controller.py
          tests/test_runtime_entry_path_guards.py
          tests/test_next_stage_regressions.py
      - name: Run full test suite
        run: uv run --locked pytest
      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src tests
      - name: Check undefined names
        run: uv run --locked ruff check src tests --select F821
      - name: Remove temporary migration assets
        run: rm tools/phase5a_apply.py tools/phase5a_fix_app_wrapper.py .github/workflows/phase5a-apply.yml
      - name: Recheck final diff and publish validated tree
        run: |
          git diff --check origin/main
          files="$(git diff --name-only origin/main | sort)"
          printf '%s\n' "$files"
          expected="$(printf '%s\n' \
            src/picture_capture/app.py \
            src/picture_capture/bootstrap/gui.py \
            src/picture_capture/ordinary_action_runtime.py \
            src/picture_capture/ui/controllers/detection.py \
            tests/test_runtime_entry_path_guards.py \
            tests/test_ui_detection_controller.py | sort)"
          test "$files" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: retire ordinary action runtime monkey patch"
          git push origin HEAD:refactor/phase-5a-retire-ordinary-runtime
