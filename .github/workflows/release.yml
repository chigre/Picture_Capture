name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          project_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          init_text = Path("src/picture_capture/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', init_text)
          if match is None:
              raise SystemExit("Could not read __version__ from src/picture_capture/__init__.py")
          package_version = match.group(1)

          expected_tag = f"v{project_version}"
          if package_version != project_version:
              raise SystemExit(
                  f"Version mismatch: pyproject={project_version}, package={package_version}"
              )
          if tag != expected_tag:
              raise SystemExit(
                  f"Tag mismatch: tag={tag}, expected={expected_tag}"
              )
          print(f"Release version verified: {tag}")
          PY

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run pytest
        run: uv run --locked pytest

      - name: Run compatibility test runner
        run: uv run --locked python run_tests.py

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Build wheel
        run: uv build --wheel

      - name: Build source and release archives
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          package="Picture_Capture-${VERSION}"

          git archive --format=zip --prefix="${package}-source/" \
            --output="dist/${package}-source.zip" HEAD

          staging="$(mktemp -d)"
          mkdir -p "${staging}/${package}"
          cp -R \
            src scripts docs examples \
            README.md CHANGELOG.md LICENSE.txt pyproject.toml uv.lock .python-version \
            run.py run_tests.py \
            run_windows.bat install_ocr_windows.bat \
            run_linux.sh install_ocr_linux.sh \
            run_macos.command install_ocr_macos.command \
            "${staging}/${package}/"
          chmod +x \
            "${staging}/${package}/run_linux.sh" \
            "${staging}/${package}/install_ocr_linux.sh" \
            "${staging}/${package}/run_macos.command" \
            "${staging}/${package}/install_ocr_macos.command"
          (cd "${staging}" && zip -qr "${GITHUB_WORKSPACE}/dist/${package}-release.zip" "${package}")

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum *.whl *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: gh release create "${RELEASE_TAG}" dist/*.whl dist/*.zip dist/SHA256SUMS.txt --generate-notes --verify-tag
