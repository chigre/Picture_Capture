name: Phase 4O isolated patch worker

on:
  push:
    branches:
      - refactor/phase4o-illustration-crop-runner

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 4O branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase4o-illustration-crop-runner
          fetch-depth: 0

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Apply narrow Phase 4O refactor and tests
        run: python scripts/phase4o_patch_worker.py

      - name: Check diff and app size
        shell: bash
        run: |
          git diff --check
          git diff --stat
          python -c "from pathlib import Path; print('app.py bytes:', Path('src/picture_capture/app.py').stat().st_size)"

      - name: Run focused Phase 4O tests
        run: >-
          uv run --locked pytest
          tests/test_ui_illustration_controller.py
          tests/test_ui_illustration_crop_controller.py
          tests/test_next_stage_regressions.py
          tests/test_runtime_entry_path_guards.py
          tests/test_boundary_placement.py
          tests/test_architecture_baseline.py
          tests/test_core.py::test_v295_illustration_crop_button_uses_shared_crop_settings_before_running_batch

      - name: Run full test suite
        run: uv run --locked pytest

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Commit validated Phase 4O change
        shell: bash
        run: |
          rm .github/workflows/phase4o-patch.yml scripts/phase4o_patch_worker.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Phase 4O: route illustration crop runner through IllustrationController"
          git push origin HEAD:refactor/phase4o-illustration-crop-runner
