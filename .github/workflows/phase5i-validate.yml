name: Phase 5I validation

on:
  push:
    branches: [refactor/phase-5i-static-local-indent]

permissions:
  contents: write

concurrency:
  group: phase5i-static-local-indent
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase-5i-static-local-indent
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Apply Phase 5I migration
        run: |
          uv run --locked python tools/phase5i_apply.py
          uv run --locked python tools/phase5i_fix_assertions.py
      - name: Check diff shape
        shell: bash
        run: |
          git add -N src/picture_capture/layout_local_indent_visualization.py
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              'scripts/architecture_guard.py',
              'src/picture_capture/bootstrap/gui.py',
              'src/picture_capture/layout_local_indent_visualization.py',
              'src/picture_capture/layout_local_indent_visualization_runtime.py',
              'src/picture_capture/layout_visualization_shared.py',
              'tests/test_layout_local_indent_visualization_runtime.py',
              'tests/test_layout_visualization_rows_capture.py',
          }
          changed = set(subprocess.check_output(
              ['git','diff','--no-renames','--name-only'], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected Phase 5I diff: {sorted(changed)}')
          PY
      - name: Architecture guard
        run: uv run --locked python scripts/architecture_guard.py
      - name: Focused regressions
        run: >-
          uv run --locked pytest -q
          tests/test_layout_local_indent_visualization_runtime.py
          tests/test_layout_visualization_indents.py
          tests/test_processing_layout_roles.py
          tests/test_layout_visualization_rows_capture.py
      - name: Full suite
        run: uv run --locked pytest -q
      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py
      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py
      - name: Remove temporary migration assets
        shell: bash
        run: |
          git rm tools/phase5i_apply.py tools/phase5i_fix_assertions.py .github/workflows/phase5i-validate.yml
          git diff --check
      - name: Publish validated production tree
        shell: bash
        run: |
          git config user.name "chigre3"
          git config user.email "guangdong.hu@gmail.com"
          git add src tests scripts
          git commit -m "Phase 5I: make local-indent visualization explicit"
          git push origin HEAD:refactor/phase-5i-static-local-indent
