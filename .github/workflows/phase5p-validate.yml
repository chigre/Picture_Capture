name: Phase 5P validation

on:
  push:
    branches:
      - refactor/phase-5p-static-illustration-opacity

concurrency:
  group: phase5p-static-illustration-opacity
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/phase-5p-static-illustration-opacity
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Apply Phase 5P migration
        run: uv run --locked python tools/phase5p_apply.py

      - name: Check diff shape
        shell: bash
        run: |
          set -euo pipefail
          git add -N src/picture_capture/illustration_fill_opacity.py tests/test_illustration_fill_opacity.py
          expected="$(cat <<'EOF'
          scripts/architecture_guard.py
          src/picture_capture/app.py
          src/picture_capture/bootstrap/gui.py
          src/picture_capture/illustration_fill_opacity.py
          src/picture_capture/illustration_fill_opacity_runtime.py
          src/picture_capture/models.py
          src/picture_capture/ui/settings/schema.py
          tests/test_display_opacity_defaults.py
          tests/test_illustration_fill_opacity.py
          tests/test_overlay_opacity.py
          EOF
          )"
          actual="$(git diff --no-renames --name-only | sort)"
          expected_sorted="$(printf '%s\n' "$expected" | sed 's/^          //' | sed '/^$/d' | sort)"
          if [ "$actual" != "$expected_sorted" ]; then
            echo "Unexpected Phase 5P diff"
            echo "--- expected"; printf '%s\n' "$expected_sorted"
            echo "--- actual"; printf '%s\n' "$actual"
            exit 1
          fi
          git diff --check

      - name: Architecture guard
        run: uv run --locked python scripts/architecture_guard.py

      - name: Focused regressions
        run: >-
          uv run --locked pytest -q
          tests/test_illustration_fill_opacity.py
          tests/test_display_opacity_defaults.py
          tests/test_overlay_opacity.py
          tests/test_ui_settings_schema.py

      - name: Full suite
        run: uv run --locked pytest -q

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src scripts run.py run_tests.py

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Remove temporary migration assets
        shell: bash
        run: |
          set -euo pipefail
          git rm tools/phase5p_apply.py .github/workflows/phase5p-validate.yml
          git diff --check

      - name: Publish validated production tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chigre3"
          git config user.email "guangdong.hu@gmail.com"
          git add scripts src tests
          git commit -m "Phase 5P: make illustration fill opacity explicit"
          git push origin HEAD:refactor/phase-5p-static-illustration-opacity
