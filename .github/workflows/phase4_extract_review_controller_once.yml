name: Phase 4 one-shot ReviewController read-side wiring

on:
  push:
    branches:
      - refactor/phase4-review-controller-readside
    paths:
      - .github/workflows/phase4_extract_review_controller_once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase4-review-controller-readside

      - name: Wire ReviewController into PictureCaptureApp
        shell: python
        run: |
          import ast
          from pathlib import Path
          import py_compile

          app_path = Path("src/picture_capture/app.py")
          init_path = Path("src/picture_capture/ui/controllers/__init__.py")
          controller_path = Path("src/picture_capture/ui/controllers/review.py")
          guard_path = Path("scripts/architecture_guard.py")

          app = app_path.read_text(encoding="utf-8")

          old_import = (
              "from .ui.controllers import (\n"
              "    CanvasController, PageController, SESSION_STATE_FILENAME, SessionController,\n"
              ")\n"
          )
          new_import = (
              "from .ui.controllers import (\n"
              "    CanvasController, PageController, ReviewController,\n"
              "    SESSION_STATE_FILENAME, SessionController,\n"
              ")\n"
          )
          assert app.count(old_import) == 1
          app = app.replace(old_import, new_import, 1)

          init_anchor = (
              "        self._configure_main_workspace_styles()\n"
              "        self.canvas_controller = CanvasController(self)\n"
              "        self.page_controller = PageController(self)\n"
              "        self._build_ui()\n"
          )
          assert app.count(init_anchor) == 1
          app = app.replace(
              init_anchor,
              "        self._configure_main_workspace_styles()\n"
              "        self.canvas_controller = CanvasController(self)\n"
              "        self.page_controller = PageController(self)\n"
              "        self.review_controller = ReviewController(self)\n"
              "        self._build_ui()\n",
              1,
          )

          tree = ast.parse(app)
          cls = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "PictureCaptureApp"
          )
          methods = {
              node.name: node
              for node in cls.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          replacements = {
              "_load_ocr_review_candidates": (
                  "    def _review_controller_for_call(self) -> ReviewController:\n"
                  "        controller = self.__dict__.get(\"review_controller\")\n"
                  "        if controller is None:\n"
                  "            controller = ReviewController(self)\n"
                  "            self.__dict__[\"review_controller\"] = controller\n"
                  "        return controller\n\n"
                  "    def _load_ocr_review_candidates(self) -> None:\n"
                  "        self._review_controller_for_call().load_ocr_review_candidates()\n\n"
              ),
              "get_review_candidate": (
                  "    def get_review_candidate(self, candidate_id: str) -> dict | None:\n"
                  "        return self._review_controller_for_call().get_review_candidate(candidate_id)\n\n"
              ),
              "_candidate_is_selected": (
                  "    def _candidate_is_selected(self, cand: dict) -> bool:\n"
                  "        return self._review_controller_for_call().candidate_is_selected(cand)\n\n"
              ),
              "_entry_for_candidate": (
                  "    def _entry_for_candidate(self, cand: dict) -> WordEntry | None:\n"
                  "        return self._review_controller_for_call().entry_for_candidate(cand)\n\n"
              ),
              "clear_review_entry_highlight": (
                  "    def clear_review_entry_highlight(self) -> None:\n"
                  "        self._review_controller_for_call().clear_review_entry_highlight()\n\n"
              ),
              "highlight_review_entry": (
                  "    def highlight_review_entry(self, entry: WordEntry) -> None:\n"
                  "        self._review_controller_for_call().highlight_review_entry(entry)\n\n"
              ),
              "jump_to_review_candidate": (
                  "    def jump_to_review_candidate(self, cand: dict) -> None:\n"
                  "        self._review_controller_for_call().jump_to_review_candidate(cand)\n\n"
              ),
          }
          assert set(replacements).issubset(methods)
          lines = app.splitlines(keepends=True)
          spans = []
          for name, replacement in replacements.items():
              node = methods[name]
              start = min([node.lineno] + [d.lineno for d in node.decorator_list]) - 1
              end = node.end_lineno
              spans.append((start, end, name, replacement))
          for start, end, name, replacement in sorted(spans, reverse=True):
              lines[start:end] = replacement.splitlines(keepends=True)
          app = "".join(lines)
          app_path.write_text(app, encoding="utf-8", newline="\n")

          controllers_init = init_path.read_text(encoding="utf-8")
          old_init = (
              '"""Explicit controllers coordinating Picture Capture UI workflows."""\n\n'
              "from .canvas import CanvasController\n"
              "from .page import PageController\n"
              "from .session import SESSION_STATE_FILENAME, SessionController\n\n"
              '__all__ = [\n'
              '    "CanvasController", "PageController", "SessionController", "SESSION_STATE_FILENAME",\n'
              ']\n'
          )
          new_init = (
              '"""Explicit controllers coordinating Picture Capture UI workflows."""\n\n'
              "from .canvas import CanvasController\n"
              "from .page import PageController\n"
              "from .review import ReviewController\n"
              "from .session import SESSION_STATE_FILENAME, SessionController\n\n"
              '__all__ = [\n'
              '    "CanvasController", "PageController", "ReviewController",\n'
              '    "SessionController", "SESSION_STATE_FILENAME",\n'
              ']\n'
          )
          assert controllers_init == old_init
          init_path.write_text(new_init, encoding="utf-8", newline="\n")

          updated = app_path.read_text(encoding="utf-8")
          assert updated.count("self.review_controller = ReviewController(self)") == 1
          assert updated.index("self.review_controller = ReviewController(self)") < updated.index("self._build_ui()")
          assert 'self.__dict__.get("review_controller")' in updated
          for app_method, controller_method in {
              "_load_ocr_review_candidates": "load_ocr_review_candidates",
              "get_review_candidate": "get_review_candidate",
              "_candidate_is_selected": "candidate_is_selected",
              "_entry_for_candidate": "entry_for_candidate",
              "clear_review_entry_highlight": "clear_review_entry_highlight",
              "highlight_review_entry": "highlight_review_entry",
              "jump_to_review_candidate": "jump_to_review_candidate",
          }.items():
              assert f"def {app_method}(" in updated
              assert f"self._review_controller_for_call().{controller_method}" in updated

          # Durable writes and the complex crop/highlight renderer intentionally stay in app.py.
          assert "def set_candidate_selected(" in updated
          assert "def apply_candidate_choice(" in updated
          assert "def _draw_review_entry_highlight(" in updated
          assert "_review_crop_settings(" in updated
          assert "_review_line_box(" in updated

          controller = controller_path.read_text(encoding="utf-8")
          controller_tree = ast.parse(controller)
          for node in ast.walk(controller_tree):
              if isinstance(node, ast.Import):
                  assert all(alias.name != "picture_capture.app" for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  assert node.module not in {"app", "picture_capture.app"}
          assert "save_pdic" not in controller
          assert "_write_manual_override" not in controller
          assert "set_candidate_selected" not in controller
          assert "apply_candidate_choice" not in controller

          py_compile.compile(str(app_path), doraise=True)
          py_compile.compile(str(controller_path), doraise=True)
          py_compile.compile(str(init_path), doraise=True)

          size = len(app_path.read_bytes())
          guard = guard_path.read_text(encoding="utf-8")
          old_guard = '    "app.py": 882_308,'
          assert guard.count(old_guard) == 1
          rendered = f"{size:,}".replace(",", "_")
          guard = guard.replace(old_guard, f'    "app.py": {rendered},', 1)
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"APP_BYTES={size}")

      - name: Check patch whitespace
        run: git diff --check

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove one-shot workflow and commit ReviewController wiring
        shell: bash
        run: |
          rm .github/workflows/phase4_extract_review_controller_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/architecture_guard.py \
            src/picture_capture/app.py \
            src/picture_capture/ui/controllers/__init__.py \
            src/picture_capture/ui/controllers/review.py \
            tests/test_ui_review_controller.py \
            .github/workflows/phase4_extract_review_controller_once.yml
          git commit -m "refactor: route review read-side through ReviewController"
          git push origin HEAD:refactor/phase4-review-controller-readside
