name: Phase 4M one-shot migration

on:
  push:
    branches: [refactor/phase4m-illustration-detection-controller]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase4m-illustration-detection-controller

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Complete Phase 4M app wiring
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          root = Path.cwd()
          app_path = root / "src/picture_capture/app.py"
          guard_path = root / "scripts/architecture_guard.py"
          text = app_path.read_text(encoding="utf-8")

          old_import = '''from .ui.controllers import (\n    CanvasController, CropController, DetectionController, ExportController,\n    PageController, ProjectController, ReviewController, SESSION_STATE_FILENAME,\n    SessionController,\n)'''
          new_import = '''from .ui.controllers import (\n    CanvasController, CropController, DetectionController, ExportController,\n    IllustrationController, PageController, ProjectController, ReviewController,\n    SESSION_STATE_FILENAME, SessionController,\n)'''
          assert text.count(old_import) == 1, "controller import block drifted"
          text = text.replace(old_import, new_import, 1)

          init_needle = "        self.export_controller = ExportController(self)\n"
          assert text.count(init_needle) == 1, "controller initialization seam drifted"
          text = text.replace(
              init_needle,
              init_needle + "        self.illustration_controller = IllustrationController(self)\n",
              1,
          )

          tree = ast.parse(text)
          app_class = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "PictureCaptureApp"
          )
          method = next(
              node for node in app_class.body
              if isinstance(node, ast.FunctionDef) and node.name == "detect_illustrations_selected_scope"
          )
          assert method.end_lineno is not None
          old_method = "".join(text.splitlines(keepends=True)[method.lineno - 1:method.end_lineno])
          assert '"已有批量任务正在运行，请结束后再执行插图识别。"' in old_method
          assert "write_ppp(" in old_method
          assert "messagebox.askyesno(" in old_method
          assert "detect_illustrations_job(" in old_method
          assert "foreground_page_edit=True" in old_method
          assert "page_indexer=lambda i: int(i)" in old_method

          lines = text.splitlines(keepends=True)
          wrapper = '''    def _illustration_controller_for_call(self) -> IllustrationController:\n        controller = self.__dict__.get("illustration_controller")\n        if controller is None:\n            controller = IllustrationController(self)\n            self.__dict__["illustration_controller"] = controller\n        return controller\n\n    def detect_illustrations_selected_scope(self) -> None:\n        self._illustration_controller_for_call().detect_illustrations_selected_scope()\n'''
          lines[method.lineno - 1:method.end_lineno] = wrapper.splitlines(keepends=True)
          text = "".join(lines)

          worker_import = "    detect_illustrations_job,\n"
          assert text.count(worker_import) == 1, "detection job import drifted"
          text = text.replace(worker_import, "", 1)

          ast.parse(text)
          assert "def split_illustrations_selected_scope(self)" in text
          assert "def _start_illustration_crop(self, indices: list[int], config: dict)" in text
          assert "def _start_batch_task(" in text
          app_path.write_text(text, encoding="utf-8")

          new_size = len(app_path.read_bytes().replace(b"\r\n", b"\n").replace(b"\r", b"\n"))
          assert new_size < 869_531, f"app.py did not shrink: {new_size}"
          guard = guard_path.read_text(encoding="utf-8")
          assert '"app.py": 869_531,' in guard
          guard = guard.replace('"app.py": 869_531,', f'"app.py": {new_size:_},', 1)
          guard_path.write_text(guard, encoding="utf-8")
          print(f"Phase 4M app.py baseline: 869531 -> {new_size} bytes")
          PY

      - name: Align legacy illustration source-shape regression
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_core.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_v2101_illustration_detection_button_uses_selected_scope_and_auto_ppp():\n    from pathlib import Path\n    text = (Path(__file__).parents[1] / "src" / "picture_capture" / "app.py").read_text(encoding="utf-8")\n    assert '("插图识别", self.detect_illustrations_selected_scope)' in text\n    start = text.index("    def detect_illustrations_selected_scope(")\n    end = text.index("    def split_illustrations_selected_scope(", start)\n    block = text[start:end]\n    assert "selected_page_indices()" in block\n    assert "人工绘制的 PPP 多边形会保留" in block\n    assert "foreground_page_edit=True" in block\n'''
          new = '''def test_v2101_illustration_detection_button_uses_selected_scope_and_auto_ppp():\n    from pathlib import Path\n    root = Path(__file__).parents[1]\n    app = (root / "src" / "picture_capture" / "app.py").read_text(encoding="utf-8")\n    controller = (root / "src" / "picture_capture" / "ui" / "controllers" / "illustration.py").read_text(encoding="utf-8")\n    assert '("插图识别", self.detect_illustrations_selected_scope)' in app\n    start = app.index("    def detect_illustrations_selected_scope(")\n    end = app.index("    def split_illustrations_selected_scope(", start)\n    wrapper = app[start:end]\n    assert "self._illustration_controller_for_call().detect_illustrations_selected_scope()" in wrapper\n    assert "selected_page_indices()" in controller\n    assert "人工绘制的 PPP 多边形会保留" in controller\n    assert "foreground_page_edit=True" in controller\n'''
          assert text.count(old) == 1, "legacy illustration source-shape test drifted"
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run targeted Phase 4M tests
        run: uv run --locked pytest -q tests/test_ui_illustration_controller.py tests/test_architecture_baseline.py tests/test_next_stage_regressions.py tests/test_postproduction_single_line_runtime.py tests/test_core.py::test_v2101_illustration_detection_button_uses_selected_scope_and_auto_ppp

      - name: Compile touched Python
        run: uv run --locked python -m py_compile src/picture_capture/app.py src/picture_capture/ui/controllers/illustration.py src/picture_capture/ui/controllers/__init__.py tests/test_ui_illustration_controller.py tests/test_core.py

      - name: Check diff whitespace
        run: git diff --check

      - name: Run complete pytest suite
        run: uv run --locked pytest

      - name: Check undefined names
        run: uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py

      - name: Commit validated migration and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/phase4m-one-shot.yml
          git config user.name "Picture Capture Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route illustration detection through IllustrationController"
          git push origin HEAD:refactor/phase4m-illustration-detection-controller
