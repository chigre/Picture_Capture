name: Temporary Phase 4P validation

on:
  push:
    branches:
      - refactor/phase4p-picdic-build-entry

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: refactor/phase4p-picdic-build-entry

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Apply narrow Phase 4P patch
        run: |
          uv run --locked python tools/tmp_phase4p_patch.py
          uv run --locked python tools/tmp_phase4p_postfix.py

      - name: Validate diff shape
        run: |
          git diff --check
          git diff -- src/picture_capture/app.py src/picture_capture/ui/controllers/export.py tests/test_ui_export_controller.py

      - name: Run focused controller and regression tests
        run: uv run --locked pytest -q tests/test_ui_export_controller.py tests/test_ui_illustration_crop_controller.py tests/test_next_stage_regressions.py

      - name: Run full suite
        run: uv run --locked pytest -q

      - name: Compile and undefined-name checks
        run: |
          uv run --locked python -m compileall -q src scripts run.py run_tests.py
          uv run --locked ruff check --select F821 src tests scripts run.py run_tests.py
          wc -c src/picture_capture/app.py

      - name: Commit validated Phase 4P patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/picture_capture/app.py src/picture_capture/ui/controllers/export.py tests/test_ui_export_controller.py
          git rm tools/tmp_phase4p_patch.py tools/tmp_phase4p_postfix.py .github/workflows/tmp-phase4p-validate.yml
          git commit -m "Phase 4P: route PicDic build through ExportController"
          git push origin HEAD:refactor/phase4p-picdic-build-entry
