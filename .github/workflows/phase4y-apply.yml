name: Phase 4Y isolated validation

on:
  push:
    branches:
      - refactor/phase-4y-detection-current
    paths:
      - .github/workflows/phase4y-apply.yml

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install locked dev dependencies
        run: uv sync --locked --group dev
      - name: Apply app wrapper and focused-test patch
        run: |
          uv run --locked python tools/phase4y_apply.py
          uv run --locked python tools/phase4y_adjust_regressions.py
      - name: Check complete Phase 4Y diff shape
        run: |
          git fetch origin main --depth=1
          git diff --check origin/main
      - name: Run focused controller regressions
        run: uv run --locked pytest tests/test_ui_detection_controller.py tests/test_next_stage_regressions.py
      - name: Run full test suite
        run: uv run --locked pytest
      - name: Compile Python sources
        run: uv run --locked python -m compileall -q src tests
      - name: Check undefined names
        run: uv run --locked ruff check src tests --select F821
      - name: Remove temporary migration assets
        run: rm tools/phase4y_apply.py tools/phase4y_adjust_regressions.py .github/workflows/phase4y-apply.yml
      - name: Recheck final diff and publish validated tree
        run: |
          git diff --check origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route current-page detection through DetectionController"
          git push origin HEAD:refactor/phase-4y-detection-current
