name: Phase 4 one-shot CanvasController viewport wiring

on:
  push:
    branches:
      - refactor/phase4-canvas-controller-view
    paths:
      - .github/workflows/phase4_extract_canvas_controller_once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/phase4-canvas-controller-view

      - name: Wire CanvasController into PictureCaptureApp
        shell: python
        run: |
          import ast
          from pathlib import Path
          import py_compile

          app_path = Path("src/picture_capture/app.py")
          init_path = Path("src/picture_capture/ui/controllers/__init__.py")
          controller_path = Path("src/picture_capture/ui/controllers/canvas.py")
          guard_path = Path("scripts/architecture_guard.py")

          app = app_path.read_text(encoding="utf-8")

          old_import = (
              "from .ui.controllers import (\n"
              "    PageController, SESSION_STATE_FILENAME, SessionController,\n"
              ")\n"
          )
          new_import = (
              "from .ui.controllers import (\n"
              "    CanvasController, PageController, SESSION_STATE_FILENAME, SessionController,\n"
              ")\n"
          )
          assert app.count(old_import) == 1
          app = app.replace(old_import, new_import, 1)

          init_anchor = (
              "        self._configure_main_workspace_styles()\n"
              "        self.page_controller = PageController(self)\n"
              "        self._build_ui()\n"
          )
          assert app.count(init_anchor) == 1
          app = app.replace(
              init_anchor,
              "        self._configure_main_workspace_styles()\n"
              "        self.canvas_controller = CanvasController(self)\n"
              "        self.page_controller = PageController(self)\n"
              "        self._build_ui()\n",
              1,
          )

          tree = ast.parse(app)
          cls = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "PictureCaptureApp"
          )
          methods = {
              node.name: node
              for node in cls.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          replacements = {
              "_display_mode_from_flags": (
                  "    def _display_mode_from_flags(self) -> str:\n"
                  "        return self.canvas_controller.display_mode_from_flags()\n\n"
              ),
              "_sync_display_mode_from_flags": (
                  "    def _sync_display_mode_from_flags(self) -> None:\n"
                  "        self.canvas_controller.sync_display_mode_from_flags()\n\n"
              ),
              "_apply_display_mode": (
                  "    def _apply_display_mode(self, _event=None) -> None:\n"
                  "        self.canvas_controller.apply_display_mode(_event)\n\n"
              ),
              "_toggle_binary_preview": (
                  "    def _toggle_binary_preview(self) -> None:\n"
                  "        self.canvas_controller.toggle_binary_preview()\n\n"
              ),
              "_toggle_hide_overlays": (
                  "    def _toggle_hide_overlays(self) -> None:\n"
                  "        self.canvas_controller.toggle_hide_overlays()\n\n"
              ),
              "_toggle_crop_preview": (
                  "    def _toggle_crop_preview(self) -> None:\n"
                  "        self.canvas_controller.toggle_crop_preview()\n\n"
              ),
              "_update_view_zoom_label": (
                  "    def _update_view_zoom_label(self) -> None:\n"
                  "        self.canvas_controller.update_view_zoom_label()\n\n"
              ),
              "zoom": (
                  "    def zoom(self, factor: float) -> None:\n"
                  "        self.canvas_controller.zoom(factor)\n\n"
              ),
              "apply_view_zoom_text": (
                  "    def apply_view_zoom_text(self, _event=None) -> None:\n"
                  "        self.canvas_controller.apply_view_zoom_text(_event)\n\n"
              ),
              "fit_page_width": (
                  "    def fit_page_width(self) -> None:\n"
                  "        self.canvas_controller.fit_page_width()\n\n"
              ),
              "fit_page_height": (
                  "    def fit_page_height(self) -> None:\n"
                  "        self.canvas_controller.fit_page_height()\n\n"
              ),
              "canvas_mousewheel": (
                  "    def canvas_mousewheel(self, event: tk.Event) -> str:\n"
                  "        return self.canvas_controller.canvas_mousewheel(event)\n\n"
              ),
              "canvas_shift_mousewheel": (
                  "    def canvas_shift_mousewheel(self, event: tk.Event) -> str:\n"
                  "        return self.canvas_controller.canvas_shift_mousewheel(event)\n\n"
              ),
              "canvas_ctrl_mousewheel": (
                  "    def canvas_ctrl_mousewheel(self, event: tk.Event) -> str:\n"
                  "        return self.canvas_controller.canvas_ctrl_mousewheel(event)\n\n"
              ),
              "canvas_linux_mousewheel": (
                  "    def canvas_linux_mousewheel(self, event: tk.Event, step: int) -> str:\n"
                  "        return self.canvas_controller.canvas_linux_mousewheel(event, step)\n\n"
              ),
              "original_xy": (
                  "    def original_xy(self, event: tk.Event) -> tuple[int, int]:\n"
                  "        return self.canvas_controller.original_xy(event)\n\n"
              ),
          }
          assert set(replacements).issubset(methods)

          lines = app.splitlines(keepends=True)
          spans = []
          for name, replacement in replacements.items():
              node = methods[name]
              start = min([node.lineno] + [d.lineno for d in node.decorator_list]) - 1
              end = node.end_lineno
              spans.append((start, end, name, replacement))
          for start, end, name, replacement in sorted(spans, reverse=True):
              lines[start:end] = replacement.splitlines(keepends=True)
          app = "".join(lines)
          app_path.write_text(app, encoding="utf-8", newline="\n")

          controllers_init = init_path.read_text(encoding="utf-8")
          old_init = (
              '"""Explicit controllers coordinating Picture Capture UI workflows."""\n\n'
              "from .page import PageController\n"
              "from .session import SESSION_STATE_FILENAME, SessionController\n\n"
              '__all__ = ["PageController", "SessionController", "SESSION_STATE_FILENAME"]\n'
          )
          new_init = (
              '"""Explicit controllers coordinating Picture Capture UI workflows."""\n\n'
              "from .canvas import CanvasController\n"
              "from .page import PageController\n"
              "from .session import SESSION_STATE_FILENAME, SessionController\n\n"
              '__all__ = [\n'
              '    "CanvasController", "PageController", "SessionController", "SESSION_STATE_FILENAME",\n'
              ']\n'
          )
          assert controllers_init == old_init
          init_path.write_text(new_init, encoding="utf-8", newline="\n")

          updated = app_path.read_text(encoding="utf-8")
          assert updated.count("self.canvas_controller = CanvasController(self)") == 1
          assert updated.index("self.canvas_controller = CanvasController(self)") < updated.index("self._build_ui()")
          for name, controller_name in {
              "_display_mode_from_flags": "display_mode_from_flags",
              "_sync_display_mode_from_flags": "sync_display_mode_from_flags",
              "_apply_display_mode": "apply_display_mode",
              "_toggle_binary_preview": "toggle_binary_preview",
              "_toggle_hide_overlays": "toggle_hide_overlays",
              "_toggle_crop_preview": "toggle_crop_preview",
              "_update_view_zoom_label": "update_view_zoom_label",
              "zoom": "zoom",
              "apply_view_zoom_text": "apply_view_zoom_text",
              "fit_page_width": "fit_page_width",
              "fit_page_height": "fit_page_height",
              "canvas_mousewheel": "canvas_mousewheel",
              "canvas_shift_mousewheel": "canvas_shift_mousewheel",
              "canvas_ctrl_mousewheel": "canvas_ctrl_mousewheel",
              "canvas_linux_mousewheel": "canvas_linux_mousewheel",
              "original_xy": "original_xy",
          }.items():
              assert f"def {name}(" in updated
              assert f"self.canvas_controller.{controller_name}" in updated

          controller = controller_path.read_text(encoding="utf-8")
          controller_tree = ast.parse(controller)
          for node in ast.walk(controller_tree):
              if isinstance(node, ast.Import):
                  assert all(alias.name != "picture_capture.app" for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  assert node.module not in {"app", "picture_capture.app"}

          py_compile.compile(str(app_path), doraise=True)
          py_compile.compile(str(controller_path), doraise=True)
          py_compile.compile(str(init_path), doraise=True)

          size = len(app_path.read_bytes())
          guard = guard_path.read_text(encoding="utf-8")
          old_guard = '    "app.py": 891_662,'
          assert guard.count(old_guard) == 1
          rendered = f"{size:,}".replace(",", "_")
          guard = guard.replace(old_guard, f'    "app.py": {rendered},', 1)
          guard_path.write_text(guard, encoding="utf-8", newline="\n")
          print(f"APP_BYTES={size}")

      - name: Check patch whitespace
        run: git diff --check

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install locked dev dependencies
        run: uv sync --locked --group dev

      - name: Run full pytest suite
        run: uv run --locked pytest

      - name: Remove one-shot workflow and commit CanvasController wiring
        shell: bash
        run: |
          rm .github/workflows/phase4_extract_canvas_controller_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/architecture_guard.py \
            src/picture_capture/app.py \
            src/picture_capture/ui/controllers/__init__.py \
            src/picture_capture/ui/controllers/canvas.py \
            tests/test_ui_canvas_controller.py \
            .github/workflows/phase4_extract_canvas_controller_once.yml
          git commit -m "refactor: route canvas viewport through CanvasController"
          git push origin HEAD:refactor/phase4-canvas-controller-view
