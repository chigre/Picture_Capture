[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "picture-capture-restored"
version = "2.14.0"
description = "Python restoration of the Picture Capture dictionary-page tool"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10,<3.14"
dependencies = ["Pillow>=10", "numpy>=1.24", "pypinyin>=0.53,<1", "opencc>=1.4.2,<2", "charset-normalizer>=3,<4"]

[project.optional-dependencies]
# Backward-compatible individual extras.
paddleocr = ["paddleocr>=3.7,<4", "paddlepaddle==3.3.0"]
lens = ["chrome-lens-py>=3.4,<4"]

# Recommended OCR profiles. CPU/GPU runtimes are fully declared here so the
# Windows installer only needs a standard locked uv sync.
ocr-cpu = ["paddleocr>=3.7,<4", "paddlepaddle==3.3.0", "chrome-lens-py>=3.4,<4"]
ocr-gpu-cu118 = ["paddleocr>=3.7,<4", "paddlepaddle-gpu==3.3.0", "chrome-lens-py>=3.4,<4"]
ocr-gpu-cu126 = ["paddleocr>=3.7,<4", "paddlepaddle-gpu==3.3.0", "chrome-lens-py>=3.4,<4", "nvidia-cudnn-cu12==9.5.1.17; sys_platform == 'win32'"]
ocr-gpu-cu129 = ["paddleocr>=3.7,<4", "paddlepaddle-gpu==3.3.0", "chrome-lens-py>=3.4,<4", "nvidia-cudnn-cu12==9.9.0.52; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
picture-capture = "picture_capture.app:main"
picture-capture-cli = "picture_capture.cli:main"

[tool.uv]
required-version = ">=0.11"
conflicts = [
    [
        { extra = "paddleocr" },
        { extra = "ocr-cpu" },
        { extra = "ocr-gpu-cu118" },
        { extra = "ocr-gpu-cu126" },
        { extra = "ocr-gpu-cu129" },
    ],
]

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }
paddlepaddle-gpu = [
    { index = "paddle-gpu-cu118", extra = "ocr-gpu-cu118" },
    { index = "paddle-gpu-cu126", extra = "ocr-gpu-cu126" },
    { index = "paddle-gpu-cu129", extra = "ocr-gpu-cu129" },
]

[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "paddle-gpu-cu118"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu118/"
explicit = true

[[tool.uv.index]]
name = "paddle-gpu-cu126"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
explicit = true

[[tool.uv.index]]
name = "paddle-gpu-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
picture_capture = [
    "data/*.json",
    "data/layout_example/*.png",
    "data/headword_examples/*.jpg",
    "data/headword_examples/*.png",
    "data/headword_examples/*.jpeg",
    "data/headword_examples/*.webp",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
